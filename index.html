<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFoot Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#e4f1e7;--bg2:#dbecdf;--panel:#fff;--ink:#14261a;--muted:#5b6f61;--line:#cfe0d3;--row:#f2f8f3;
  --brand:#1f8a4c;--brand2:#146b39;--head:#146b39;--brand-ink:#fff;--tint:#e8f5ec;--accent:#f5c518;--accent-ink:#2a2200;
  --good:#1b8a3e;--bad:#c0392b;--info:#1f5fa8;--warn:#b7791f;
  --pG:#d97706;--pD:#2563eb;--pM:#16a34a;--pA:#dc2626;
  --shadow:0 1px 2px rgba(16,64,32,.06),0 6px 18px rgba(16,64,32,.07);
  --r:14px;--rb:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a12;--bg2:#102017;--panel:#152519;--ink:#e3eee6;--muted:#9db3a3;--line:#284033;--row:#1a2d20;
  --brand:#25a35a;--brand2:#17793f;--head:#6fdc9a;--tint:#1b3324;--good:#3ccf6e;--bad:#ff6b5b;--info:#6aa8ff;--warn:#f0b44c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1a12;--bg2:#102017;--panel:#152519;--ink:#e3eee6;--muted:#9db3a3;--line:#284033;--row:#1a2d20;
  --brand:#25a35a;--brand2:#17793f;--head:#6fdc9a;--tint:#1b3324;--good:#3ccf6e;--bad:#ff6b5b;--info:#6aa8ff;--warn:#f0b44c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
/* faixas suaves como o gramado cortado */
body{margin:0;min-height:100vh;color:var(--ink);font:.875rem/1.45 Inter,system-ui,"Segoe UI",Roboto,sans-serif;
  background:var(--bg) repeating-linear-gradient(90deg,transparent 0 90px,var(--bg2) 90px 180px) fixed}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--rb);padding:.48rem .95rem;font-weight:600;
  box-shadow:0 1px 2px rgba(16,64,32,.08);transition:transform .12s,box-shadow .12s,background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--brand);background:var(--tint);transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,64,32,.12)}
button:active:not(:disabled){transform:translateY(0);box-shadow:none}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:linear-gradient(var(--brand),var(--brand2));border-color:var(--head);color:var(--brand-ink)}
button.primary:hover:not(:disabled){background:var(--brand);color:var(--brand-ink)}
button.danger{color:var(--bad)}
button.danger:hover:not(:disabled){border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
select,input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.42rem .6rem;max-width:100%}
input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:var(--brand)}
label{display:inline-flex;flex-direction:column;gap:.2rem;font-size:.82rem;color:var(--muted);font-weight:500}
label.check{flex-direction:row;align-items:center;gap:.45rem;font-size:.92rem;color:var(--ink)}
h1,h2,h3{margin:.2rem 0 .6rem;line-height:1.2;font-family:"Barlow Semi Condensed",Inter,system-ui,sans-serif;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.3rem;color:var(--head)}h3{font-size:1.08rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;padding:.6rem 1rem;
  background:linear-gradient(100deg,var(--brand2),var(--brand));color:var(--brand-ink);box-shadow:0 2px 12px rgba(10,50,25,.25)}
.bar .logo{font:800 1.25rem "Barlow Semi Condensed",sans-serif;letter-spacing:.5px}
.bar .info{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.9rem;flex:1;color:inherit;align-items:center}
.bar .tag{background:rgba(255,255,255,.16);padding:.12rem .6rem;border-radius:99px}
.bar button.primary{background:var(--accent);border-color:#d8ab00;color:var(--accent-ink);padding:.55rem 1.2rem}
.bar button.primary:hover:not(:disabled){background:#ffd633;color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:200px 1fr;gap:1rem;padding:1rem;max-width:1400px;margin:auto}
nav{display:flex;flex-direction:column;gap:.25rem;align-self:start;position:sticky;top:4.6rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.5rem;box-shadow:var(--shadow)}
nav button{text-align:left;border-color:transparent;box-shadow:none;background:transparent;font-weight:500}
nav button:hover:not(:disabled){transform:none;box-shadow:none}
nav button[aria-current="page"]{background:linear-gradient(var(--brand),var(--brand2));color:var(--brand-ink);font-weight:700}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:1rem}
.grid2>*{min-width:0}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.info{color:var(--info)}.warn{color:var(--warn)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:.38rem .5rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--row);font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:right}
tbody tr:nth-child(even){background:var(--row)}
tr.me{background:color-mix(in srgb,var(--accent) 28%,transparent)!important;font-weight:600}
tr.z-euro td:first-child{box-shadow:inset 4px 0 var(--good)}
tr.z-up td:first-child{box-shadow:inset 4px 0 var(--info)}
tr.z-down td:first-child{box-shadow:inset 4px 0 var(--bad)}
.pos{display:inline-block;min-width:1.7em;text-align:center;border-radius:4px;color:#fff;font-weight:700;font-size:.78rem;padding:0 .2rem}
.pos-G{background:var(--pG)}.pos-L,.pos-Z{background:var(--pD)}.pos-M{background:var(--pM)}.pos-A{background:var(--pA)}
button.link{background:none;border:0;padding:0;color:var(--info);text-decoration:underline;text-align:left;box-shadow:none;font-weight:inherit;border-radius:2px}
button.link:hover:not(:disabled){background:none;transform:none;box-shadow:none}
button.sel{min-width:2.4em;padding:.15rem .35rem;font-weight:700;border-radius:6px}
.sel.T{background:var(--brand);color:#fff}.sel.R{background:var(--info);color:#fff}
.en{display:inline-block;width:54px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;overflow:hidden}
.en i{display:block;height:100%}
.f{font-weight:700}
.stars{color:var(--warn);letter-spacing:-1px}
.start{max-width:1000px;margin:1.5rem auto;padding:0 1rem}
.hero{text-align:center;padding:2rem 1.2rem}
.hero h1{font-size:clamp(2rem,6vw,3rem);color:var(--brand);margin-bottom:1.2rem}
.clublist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:.5rem;max-height:55vh;overflow:auto;padding:.3rem}
.clublist button{text-align:left;display:flex;flex-direction:column;gap:.1rem;font-weight:400}
.clublist button[aria-pressed="true"]{border:2px solid var(--brand);background:var(--tint)}
.score{display:flex;align-items:center;justify-content:center;gap:1rem;font-size:1.3rem;font-weight:700;text-align:center}
.score .g{font-size:2.4rem;min-width:1.6em;background:linear-gradient(var(--brand),var(--brand2));color:#fff;border-radius:10px;padding:0 .3rem}
.score .t{flex:1}
progress{width:100%;height:10px;accent-color:var(--brand)}
.evlist{max-height:46vh;overflow:auto;font-size:.9rem;margin:0;padding:0;list-style:none}
.evlist li{padding:.25rem .35rem;border-bottom:1px solid var(--line)}
.evlist li.goal{font-weight:700;background:color-mix(in srgb,var(--good) 14%,transparent)}
.evlist li.rc{color:var(--bad)}
.notice{padding:.55rem .8rem;border-radius:10px;background:color-mix(in srgb,var(--accent) 22%,var(--panel));border:1px solid var(--accent);margin-bottom:.6rem}
.msg{border-left:4px solid var(--line);padding:.45rem .65rem;margin-bottom:.4rem;background:var(--row);border-radius:0 8px 8px 0}
.msg.unread{border-left-color:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.6rem;margin:.4rem 0 .8rem}
.stat div{background:var(--tint);border-radius:10px;padding:.5rem .7rem;font-size:.82rem;color:var(--muted)}
.stat b{display:block;font:700 1.5rem "Barlow Semi Condensed",sans-serif;color:var(--head)}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);max-width:min(560px,94vw);width:100%;padding:1.1rem;box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(5,25,12,.5)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.result{padding:.45rem .65rem;border-radius:8px;margin:.5rem 0}
.result.ok{background:color-mix(in srgb,var(--good) 15%,transparent)}
.result.no{background:color-mix(in srgb,var(--bad) 13%,transparent)}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;padding:.6rem 16px}
  .grid2{grid-template-columns:1fr!important}
  nav{flex-direction:row;overflow-x:auto;position:static;padding:.35rem}
  nav button{white-space:nowrap}
  .score{font-size:1rem}.score .g{font-size:1.8rem}
}
/* ---------- cabeçalho compacto ---------- */
.bar{flex-direction:column;align-items:stretch;gap:.4rem;padding:.55rem 1rem}
.bar-main{display:flex;align-items:center;gap:.65rem;width:100%;max-width:1400px;margin:auto}
.bar .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.bar .who strong{font:700 1.15rem "Barlow Semi Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .who small{opacity:.85;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-chips{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;width:100%;max-width:1400px;margin:auto;font-size:.78rem}
.bar-chips::-webkit-scrollbar{display:none}
.bar-chips>*{flex:none;white-space:nowrap;background:rgba(255,255,255,.16);padding:.18rem .65rem;border-radius:99px;border:0;color:inherit;box-shadow:none;font-weight:500}
.bar-chips button:hover:not(:disabled){background:rgba(255,255,255,.3);transform:none;color:inherit}
.bar .crest{width:2.3rem;height:2.3rem;font-size:.85rem}
/* ---------- escudos e selos ---------- */
.crest{display:inline-grid;place-items:center;width:1.9rem;height:2.1rem;flex:none;vertical-align:middle;border-radius:14% 14% 50% 50%/10% 10% 45% 45%;
  background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%);color:#fff;font:800 .72rem/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.3px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 0 0 1px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.25);text-shadow:0 0 2px rgba(0,0,0,.85),0 1px 2px rgba(0,0,0,.6)}
.crest.sm{width:1.35rem;height:1.5rem;font-size:.55rem;margin-right:.15rem}
.crest.lg{width:3.4rem;height:3.8rem;font-size:1.2rem}
.crest.q{--c1:#8a9a90;--c2:#a9b8ae}
.chip{display:inline-block;padding:.18rem .65rem;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--brand)}
.chip-copa{background:#2563eb}.chip-eu{background:#1e3a8a}.chip-lib{background:#a16207}.chip-sul{background:#c2410c}.chip-mundial{background:#7c3aed}
/* ---------- cartões de jogo ---------- */
.next-top{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.next{border-top:4px solid var(--brand)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;margin-top:.9rem;text-align:center}
.vs .team{display:flex;flex-direction:column;align-items:center;gap:.4rem;min-width:0}
.vs .team strong{overflow-wrap:anywhere;font-size:1.02rem}
.vs .x{font:800 1.5rem "Barlow Semi Condensed",sans-serif;color:var(--muted)}
.match-card{border-top:4px solid var(--accent)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;text-align:center;margin-top:.8rem;font-size:1rem}
.score .t{display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:700;min-width:0;overflow-wrap:anywhere}
.score .mid{display:flex;align-items:center;gap:.35rem}
.score .g{font:800 2.5rem/1.15 "Barlow Semi Condensed",sans-serif;min-width:1.5em;background:linear-gradient(var(--brand),var(--brand2));color:#fff;border-radius:12px;padding:0 .3rem}
.score .sep{font-weight:800;color:var(--muted)}
.badge{margin-left:auto;padding:.18rem .7rem;border-radius:99px;font-weight:700;font-size:.8rem}
.badge.win{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.badge.loss{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.badge.draw{background:var(--row);color:var(--muted)}
.center{text-align:center}
button.big{padding:.75rem 2.2rem;font-size:1.05rem;border-radius:12px}
/* ---------- números em destaque ---------- */
/* ---------- tela inicial: estádio à noite (visual próprio, igual nos temas claro e escuro) ---------- */
.ts{--ts-bg:#03130c;--ts-ink:#f2fff6;--ts-dim:#a9c9b5;--ts-lime:#c8ff3d;--ts-glass:rgba(255,255,255,.07);--ts-edge:rgba(255,255,255,.14);
  position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;color:var(--ts-ink);isolation:isolate;
  background:radial-gradient(120% 70% at 50% -10%,#0f4a30 0,transparent 60%),linear-gradient(#04170f,var(--ts-bg) 55%,#021009)}
.ts-sky{position:absolute;inset:0;z-index:-2;pointer-events:none}
.ts-beam{position:absolute;top:-30%;width:55vmax;height:120vmax;background:linear-gradient(rgba(220,255,200,.22),transparent 70%);filter:blur(18px);
  transform-origin:top center;animation:tsBeam 9s ease-in-out infinite alternate}
.ts-beam.l{left:-12vmax;transform:rotate(-28deg)}
.ts-beam.r{right:-12vmax;transform:rotate(28deg);animation-delay:-4.5s}
@keyframes tsBeam{from{opacity:.55}to{opacity:1}}
.ts-pitch{position:absolute;left:-25%;right:-25%;bottom:-8%;height:58%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 50% 22%,transparent 0 13%,rgba(255,255,255,.22) 13.3% 13.9%,transparent 14.2%),
    linear-gradient(90deg,transparent calc(50% - 2px),rgba(255,255,255,.22) calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px)),
    repeating-linear-gradient(90deg,#0c5a34 0 8%,#0a4d2d 8% 16%);
  transform:perspective(520px) rotateX(58deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
.ts-in{max-width:980px;margin:auto;padding:clamp(1.2rem,4vw,2.6rem) 16px 2rem;display:grid;gap:clamp(1.1rem,3vw,1.8rem)}
.ts-brand{display:flex;align-items:center;justify-content:center;gap:clamp(.8rem,3vw,1.4rem);text-align:left}
.ts-logo{width:clamp(78px,16vw,124px);height:auto;flex:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45)) drop-shadow(0 0 28px rgba(31,224,138,.35));
  animation:tsFloat 4.5s ease-in-out infinite}
@keyframes tsFloat{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.ts-brand h1{margin:0;font:800 clamp(2.2rem,7.5vw,4rem)/.95 "Barlow Semi Condensed",sans-serif;letter-spacing:.5px;color:#fff;text-transform:uppercase;
  text-shadow:0 4px 18px rgba(0,0,0,.4)}
.ts-brand h1 span{display:block;font-size:.52em;letter-spacing:.32em;color:var(--ts-lime);text-shadow:0 0 18px rgba(200,255,61,.45)}
.ts-brand p{margin:.45rem 0 0;color:var(--ts-dim);font-size:clamp(.92rem,2.4vw,1.08rem)}
.ts-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:clamp(.7rem,2vw,1rem)}
.ts button{color:inherit;font:inherit}
.ts-mode{position:relative;overflow:hidden;display:grid;justify-items:start;text-align:left;gap:.25rem;padding:1.2rem 1.25rem 1.1rem;border:0;border-radius:20px;
  color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .18s,box-shadow .18s}
.ts-mode.coach{background:linear-gradient(135deg,#1fe08a,#0a8f55 55%,#06563a)}
.ts-mode.career{background:linear-gradient(135deg,#ffb23e,#ff5f45 50%,#c8246f)}
.ts-mode::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.ts-mode:hover:not(:disabled){transform:translateY(-4px) scale(1.01);box-shadow:0 22px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3);background-color:transparent;border-color:transparent}
.ts-mode.coach:hover{background:linear-gradient(135deg,#1fe08a,#0a8f55 55%,#06563a)}
.ts-mode.career:hover{background:linear-gradient(135deg,#ffb23e,#ff5f45 50%,#c8246f)}
.ts-mode:hover::after{transform:translateX(120%)}
.ts-mode .ts-ic{position:absolute;right:-.3rem;bottom:-.9rem;font-size:5.5rem;opacity:.28;transform:rotate(-12deg);line-height:1}
.ts-mode b{font:800 1.75rem/1.05 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.5px}
.ts-mode small{max-width:23rem;font-size:.92rem;opacity:.92}
.ts-go{margin-top:.55rem;padding:.35rem .85rem;border-radius:99px;background:rgba(0,0,0,.22);font-weight:700;font-size:.85rem;backdrop-filter:blur(4px)}
.ts-saves{background:var(--ts-glass);border:1px solid var(--ts-edge);border-radius:20px;padding:1rem;backdrop-filter:blur(10px)}
.ts-saves h2{margin:0 0 .7rem;color:#fff;font-size:1.05rem;text-transform:uppercase;letter-spacing:.14em}
.ts-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:.6rem}
.ts-slot{display:grid;gap:.5rem;padding:.7rem;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--ts-edge);transition:border-color .15s,background .15s}
.ts-slot.sel{border-color:var(--ts-lime);background:rgba(200,255,61,.09);box-shadow:0 0 0 1px var(--ts-lime) inset}
.ts-slot.empty{border-style:dashed}
.ts-slot-pick{all:unset;cursor:pointer;display:flex;gap:.7rem;align-items:center;min-width:0;border-radius:10px}
.ts-slot-pick:focus-visible{outline:2px solid var(--ts-lime);outline-offset:3px}
.ts-slot-ic{display:grid;place-items:center;width:2.6rem;height:2.6rem;flex:none;border-radius:12px;background:rgba(255,255,255,.1);font-size:1.3rem}
.ts-slot-txt{display:grid;min-width:0}
.ts-slot-txt small{color:var(--ts-dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.ts-slot-txt strong{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-slot-txt span{color:var(--ts-dim);font-size:.82rem;overflow-wrap:anywhere}
.ts-slot-act{display:flex;gap:.45rem}
.ts .ts-play{flex:1;border:0;border-radius:10px;padding:.5rem .8rem;font-weight:800;background:var(--ts-lime);color:#0d2a10;box-shadow:0 6px 16px rgba(200,255,61,.25)}
.ts .ts-play:hover:not(:disabled){background:#dbff7a;color:#0d2a10;border-color:transparent}
.ts-del{border:1px solid var(--ts-edge);background:transparent;border-radius:10px;padding:.45rem .7rem;box-shadow:none}
.ts-del:hover:not(:disabled){background:rgba(255,90,90,.18);border-color:#ff8a80;color:#fff}
.ts .ts-del.ok{background:#c62828;border-color:#c62828;color:#fff}
.ts-note{margin:.7rem 0 0;color:var(--ts-dim);font-size:.85rem}
.ts-note strong{color:#fff}
.ts-foot{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;color:var(--ts-dim)}
.ts-import{position:relative;flex-direction:row;align-items:center;gap:.4rem;cursor:pointer;color:#fff;font-weight:600;font-size:.9rem;
  padding:.5rem .9rem;border-radius:10px;border:1px solid var(--ts-edge);background:var(--ts-glass)}
.ts-import:hover{border-color:var(--ts-lime)}
.ts-import:focus-within{outline:2px solid var(--ts-lime);outline-offset:2px}

<script>
'use strict';
// ===================== Constantes =====================
const D = window.GAME_DATA_REAL || window.GAME_DATA; // o pacote opcional com nomes reais (data_real.js) tem prioridade
const SAVE_KEY = 'eurofoot-save-v1';
// Nomes das competições continentais vêm do pacote de dados (fictícios na versão comercial)
const NAMES = {EU:'Europa 1', LIB:'América 1', SUL:'América 2', INT:'Mundial', SMW:'Mega Mundial', ...D.names};
const LEAGUES = Object.fromEntries(D.leagues.map(l => [l.id, l]));
// Vagas diretas na fase de grupos (Libertadores = 6/5 primeiros + campeão da copa no Brasil e na Argentina)
const LIB_Q = {BR1:6, AR1:5, CO1:3, CL1:3, EC1:3, UY1:3, PY1:3, PE1:2, BO1:1, VE1:1};
const SUL_Q = {BR1:6, AR1:6, CO1:3, CL1:3, EC1:3, UY1:3, PY1:3, PE1:2, BO1:2, VE1:2};
const POS = ['G','L','Z','M','A'];
const POS_NAME = {G:'Goleiro',L:'Lateral',Z:'Zagueiro',M:'Meia',A:'Atacante'};
const FORMS = {
  '4-4-2':{G:1,L:2,Z:2,M:4,A:2}, '4-3-3':{G:1,L:2,Z:2,M:3,A:3}, '3-5-2':{G:1,L:0,Z:3,M:5,A:2},
  '5-3-2':{G:1,L:2,Z:3,M:3,A:2}, '4-5-1':{G:1,L:2,Z:2,M:5,A:1}, '3-4-3':{G:1,L:0,Z:3,M:4,A:3}, '4-2-4':{G:1,L:2,Z:2,M:2,A:4}
};
const STYLES = ['Defensivo','Equilibrado','Ofensivo'];
// Rendimento de um jogador (posição natural -> posição em campo)
const PF = {
  G:{G:1,L:.3,Z:.3,M:.3,A:.3}, L:{G:.3,L:1,Z:.85,M:.85,A:.7}, Z:{G:.3,L:.85,Z:1,M:.8,A:.65},
  M:{G:.3,L:.85,Z:.8,M:1,A:.85}, A:{G:.3,L:.7,Z:.6,M:.85,A:1}
};
const LEAGUE_SLOTS = 38;
const CUP_AFTER = new Set([5,11,17,24,31,35]);
const EURO_AFTER = new Set([3,8,14,21,29]);
const K_RATIO = 294 / 518; // ataque/defesa de um 4-4-2 equilibrado: base da probabilidade de gol
// Janelas: início da temporada (20%) e meio dela (50% a 65%), proporcional ao tamanho do calendário
const isWindow = s => { const f = s / S.cal.length; return f < .2 || (f >= .5 && f < .65); };
const windowText = () => { const N = S.cal.length; return `semanas 1–${Math.ceil(.2 * N)} e ${Math.ceil(.5 * N) + 1}–${Math.ceil(.65 * N)}`; };
const S_AFTER = new Set([6, 8, 10, 12, 14, 16, 20, 22, 25, 27, 30, 32, 34, 35, 36]); // Libertadores e Sul-Americana
const W_AFTER = new Set([18, 19, 20, 21, 22, 23, 24]); // Super Mundial (meio do ano)

let S = null; // estado salvo
const UI = {screen:'start', tab:'club', pickCountry: LEAGUES.BR1 ? 'BR1' : D.leagues[0].id, pickClub:null, tableLg:null, tableTier:1, tableCup:'', scoreLg:null, scoreTier:1,
  mkt:{q:'',pos:'',lg:'',min:0,max:0,age:0}, live:null, results:null, summary:null};

// ===================== Utilidades =====================
const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = new Intl.NumberFormat('pt-BR', {notation:'compact', maximumFractionDigits:1});
const money = n => (n < 0 ? '-' : '') + '€ ' + NF.format(Math.abs(Math.round(n)));
const P = id => S.players[id];
const C = id => S.clubs[id];
const myClub = () => C(S.man.club);
// Modo Carreira: o usuário é um jogador (S.man.pid) e o clube é comandado pela IA
const isCareer = () => S?.mode === 'player';
const coachClub = () => isCareer() ? 0 : S.man.club;
const me_p = () => P(S.man.pid);
const clubValue = c => squadValue(c); // valor do clube = valor de mercado do elenco
const SAF_MULT = 15;
function weighted(items, w) {
  let t = 0; const ws = items.map(x => { const v = w(x); t += v; return v; });
  let r = rnd() * t;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const stars = rep => '★'.repeat(clamp(Math.ceil(rep / 20), 1, 5)) + '☆'.repeat(5 - clamp(Math.ceil(rep / 20), 1, 5));
const repBadge = rep => `<span class="stars" title="Reputação ${rep}/100">${stars(rep)}</span> <span class="muted">${repTier(rep)}</span>`;
const moraleText = m => m >= 80 ? 'Empolgado' : m >= 65 ? 'Confiante' : m >= 45 ? 'Normal' : m >= 30 ? 'Abalado' : 'Em crise';
const posTag = p => `<span class="pos pos-${p}" title="${POS_NAME[p]}">${p}</span>`;
const enBar = en => `<span class="en" title="Energia ${Math.round(en)}%"><i style="width:${en}%;background:${en > 70 ? 'var(--good)' : en > 45 ? 'var(--warn)' : 'var(--bad)'}"></i></span>`;
const divKey = (lg, t) => lg + '-' + t;
function news(t) { S.news.unshift(`[${S.year} · sem ${S.slot + 1}] ${t}`); S.news.length = Math.min(S.news.length, 40); }
function mail(m) { S.inbox.unshift({id: S.nextMsg++, read: false, slot: S.slot, ...m}); S.inbox.length = Math.min(S.inbox.length, 60); }
// Manchetes com variações (ideia do GP-Tycoon): o mesmo fato com textos diferentes
const NEWS_T = {
  transfer: [(a) => `${a.to} contratou ${a.p} (${a.from}) por ${a.fee}.`, (a) => `Reforço de peso: ${a.p} deixa ${a.from} e assina com ${a.to} por ${a.fee}.`, (a) => `${a.to} fecha com ${a.p}. O negócio custou ${a.fee}.`],
  upset: [(a) => `ZEBRA! ${a.w} surpreende e vence ${a.l} por ${a.s}.`, (a) => `Ninguém esperava: ${a.w} derruba o favorito ${a.l} (${a.s}).`, (a) => `Resultado histórico: ${a.w} ${a.s} ${a.l}.`],
  rout: [(a) => `Goleada! ${a.w} atropela ${a.l} por ${a.s}.`, (a) => `${a.w} não toma conhecimento de ${a.l}: ${a.s}.`, (a) => `Massacre em campo: ${a.w} ${a.s} ${a.l}.`],
  repUp: [(a) => `${a.c} sobe de patamar e agora é considerado um clube ${a.t}.`, (a) => `Analistas reconhecem a evolução do ${a.c}: clube ${a.t}.`],
  repDown: [(a) => `${a.c} perde prestígio e passa a ser visto como clube ${a.t}.`, (a) => `Fase difícil: a reputação do ${a.c} caiu para ${a.t}.`],
};
const headline = (type, a) => news(pick(NEWS_T[type])(a));
const REP_TIERS = [[90,'Dominante'],[80,'Poderoso'],[70,'Respeitável'],[60,'Competitivo'],[50,'Emergente'],[40,'Razoável'],[30,'Mediano'],[20,'Limitado'],[10,'Enfraquecido'],[0,'Nanico']];
const repTier = rep => REP_TIERS.find(([min]) => rep >= min)[1];
// Patrocínio master (ideia do GP-Tycoon): 3 propostas por temporada com formatos diferentes
const SPONSORS = ['Banco Atlântico','TelcoNet','Vértice Seguros','Aurora Energia','Fortis Motors','Lumen Tech','Cervejaria Bravo','Horizonte Airlines','Delta Construtora','Pulse Sports','Orion Capital','Maré Alimentos'];
function sponsorOffers(club) {
  const b = club.spon, [a, c, d] = shuffle([...SPONSORS]);
  return [
    {n: a, week: b, win: 0, goal: 0, desc: 'Valor fixo toda semana.'},
    {n: c, week: Math.round(b * .6), win: Math.round(b * 2), goal: 0, desc: 'Fixo menor + bônus a cada vitória.'},
    {n: d, week: Math.round(b * .75), win: 0, goal: Math.round(b * 20), desc: 'Fixo menor + bônus se cumprir o objetivo da diretoria.'},
  ];
}

// ===================== Jogadores =====================
function ageMult(a) { return a <= 21 ? 1.6 : a <= 24 ? 1.3 : a <= 28 ? 1 : a <= 30 ? .8 : a <= 32 ? .55 : .3; }
function ratingFromValue(v, a) { return clamp(Math.round(48 + 12.5 * Math.log10(Math.max(v, 25000) / 1e5 / ageMult(a))), 35, 94); }
function niceRound(v) { const m = v >= 1e7 ? 1e6 : v >= 1e6 ? 1e5 : v >= 1e5 ? 25000 : 5000; return Math.max(10000, Math.round(v / m) * m); }
function valueOf(p) { return niceRound(1e5 * Math.pow(10, (p.r - 48) / 12.5) * ageMult(p.a)); }
function salaryFor(v) { return Math.max(1000, Math.round(v * .0016 / 100) * 100); }
function potential(r, a) { return Math.min(95, r + (a <= 19 ? ri(6, 16) : a <= 21 ? ri(3, 11) : a <= 23 ? ri(1, 6) : 0)); }

const POOLS = {};
for (const c of D.clubs) {
  const pl = POOLS[c.league] ??= {f:[], l:[], nat:[]};
  for (const [n, , , , nat] of c.players) {
    const parts = n.split(' ');
    if (parts.length > 1) { pl.f.push(parts[0]); pl.l.push(parts[parts.length - 1]); }
    if (nat) pl.nat.push(nat);
  }
}
const genName = lg => pick(POOLS[lg].f) + ' ' + pick(POOLS[lg].l);

function addPlayer(o) {
  const id = S.nextPid++;
  const p = {id, n:o.n, p:o.p, a:o.a, r:o.r, pt:o.pt ?? potential(o.r, o.a), v:0, sal:0, ct:o.ct ?? ri(1, 4),
    nat:o.nat || '', club:o.club || 0, en:100, inj:0, sus:0, yc:0, g:0, ap:0, sell:0, tr: o.tr ?? rollTrait(o.p),
    since: S.year - (o.club ? ri(0, clamp(o.a - 19, 0, 6)) : 0), cg:0, ca:0}; // desde quando está no clube; gols e jogos por ele
  p.v = o.v ?? valueOf(p);
  p.sal = salaryFor(p.v);
  S.players[id] = p;
  if (p.club) C(p.club).pl.push(id);
  return p;
}
function genPlayer(clubId, pos, r, age) {
  const lg = C(clubId).lg;
  return addPlayer({n: genName(lg), p: pos, a: age, r: clamp(Math.round(r), 35, 90), nat: pick(POOLS[lg].nat), club: clubId, ct: ri(1, 3)});
}
function detach(p) {
  if (!p.club) return;
  const c = C(p.club);
  c.pl = c.pl.filter(x => x !== p.id);
  c.xi = c.xi.filter(x => x !== p.id);
  c.bench = c.bench.filter(x => x !== p.id);
  p.club = 0; p.sell = 0;
}
function movePlayer(p, toId) { detach(p); p.club = toId; p.since = S.year; p.cg = p.ca = 0; if (toId) C(toId).pl.push(p.id); }
function removePlayer(p) { detach(p); delete S.players[p.id]; }

// ===================== Clubes =====================
function clubAvg(club, n = 11) {
  const rs = club.pl.map(id => P(id).r).sort((a, b) => b - a).slice(0, n);
  return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 40;
}
const squadScore = club => clamp((clubAvg(club, 16) - 55) * 3.7, 0, 100);
const fanScore = club => clamp(club.seats / 600, 0, 100);
// Reputação composta (inspirada no GP-Tycoon): elenco, desempenho das 3 últimas temporadas
// (pesos 4/2/1), torcida e tradição. Muda no máximo 10 pontos por temporada.
function calcReputation(club) {
  const w = [4, 2, 1], perf = club.perf.slice(0, 3);
  const perfAvg = perf.length ? perf.reduce((s, v, i) => s + v * w[i], 0) / w.slice(0, perf.length).reduce((a, b) => a + b, 0) : squadScore(club);
  const target = .5 * squadScore(club) + .35 * perfAvg + .15 * fanScore(club) + Math.min(10, club.titles * 2);
  return Math.round(clamp(target, club.rep - 10, club.rep + 10));
}
function updateEcon(club) {

    if (S.sponsor?.win && m.gh !== m.ga && winner(m) === S.man.club) { myClub().cash += S.sponsor.win; S.fin.pat += S.sponsor.win; }
  }
  rateMatch(m);
  updateMorale(m);
  recordMatch(m);
  if (S.man?.club && (m.h === S.man.club || m.a === S.man.club)) myMatchDone(m);
}
// Moral sobe com vitórias e cai com derrotas; vencer um favorito vale mais
function updateMorale(m) {
  const H = C(m.h), A = C(m.a), diff = clubAvg(H) - clubAvg(A);
  const w = m.gh > m.ga ? m.h : m.ga > m.gh ? m.a : m.pen ? winner(m) : 0;
  for (const [c, edge] of [[H, diff], [A, -diff]]) {
    const d = !w ? (edge > 3 ? -2 : edge < -3 ? 2 : 0) : w === c.id ? (edge < -4 ? 10 : 6) : (edge > 4 ? -10 : -6);
    c.mor = clamp(c.mor + d * (isDerby(m.h, m.a) ? 2 : 1), 20, 100); // clássico vale o dobro
  }
  // Manchetes só do que interessa ao jogador: sua divisão ou a Copa dos Campeões
  const me = myClub();
  if (!(m.div === divKey(me.lg, me.tier) || m.cup === 'EU' || m.tour)) return;
  if (!w || m.gh === m.ga) return;
  const W = C(w), L = w === m.h ? A : H, s = `${Math.max(m.gh, m.ga)} x ${Math.min(m.gh, m.ga)}`;
  if (isDerby(m.h, m.a)) return news(`⚔️ Clássico: ${W.name} vence o ${L.name} por ${s}.`);
  if (clubAvg(L) - clubAvg(W) >= 6) headline('upset', {w: W.name, l: L.name, s});
  else if (Math.abs(m.gh - m.ga) >= 4) headline('rout', {w: W.name, l: L.name, s});
}
function boardAfterMatch(m) {
  const me = m.user, mine = C(m.s[me].cid), opp = C(m.s[1 - me].cid);
  const gf = me ? m.ga : m.gh, ga = me ? m.gh : m.ga;
  const fav = clubAvg(mine) - clubAvg(opp) + (me === 0 ? 2 : -2);
  let d;
  if (m.comp === 'L') d = gf > ga ? 3 : gf === ga ? (fav > 3 ? -2 : 1) : (fav < -3 ? -1 : -4);
  else { const w = winner(m); d = w ? (w === mine.id ? 2 : -2) : gf > ga ? 2 : gf < ga ? -2 : 0; }
  const fans = mine.fans ?? 60; // torcida feliz alivia a pressão da diretoria
  S.man.conf = clamp(S.man.conf + d + (fans >= 75 ? 1 : fans <= 30 ? -1 : 0), 0, 100);
}

// ===================== Copas =====================
function drawCup(cup) {
  cup.pending = []; cup.byes = [];
  if (cup.champ || cup.alive.length < 2) return [];
  const n = cup.alive.length;
  let P2 = 1; while (P2 * 2 <= n) P2 *= 2;
  let players = shuffle([...cup.alive]);
  if (P2 !== n) {
    // Fase preliminar: os mais fracos jogam, os demais avançam direto
    const sorted = [...cup.alive].sort((a, b) => clubAvg(C(a)) - clubAvg(C(b)));
    players = shuffle(sorted.slice(0, 2 * (n - P2)));
    cup.byes = sorted.slice(2 * (n - P2));
    cup.rname = 'Fase preliminar';
  } else cup.rname = {2:'Final', 4:'Semifinal', 8:'Quartas de final', 16:'Oitavas de final'}[n] || `Fase de ${n}`;
  for (let i = 0; i < players.length; i += 2) cup.pending.push([players[i], players[i + 1]]);
  return cup.pending;
}
function finishCupRound(cup, matches) {
  const winners = matches.map(winner);
  cup.log.push({name: cup.rname, games: matches.map(m => [m.h, m.a, m.gh, m.ga, m.pen])});
  const prize = cup.id === 'EU' ? 2e6 * (cup.round + 1) : 2.5e5 * (cup.round + 1);
  for (const id of winners) { C(id).cash += prize; if (id === S.man.club) S.fin.prem += prize; }
  if (cup.id === 'EU') for (const id of winners) addRank(id, 4 + ([8, 12, 18, 26][cup.round] || 0)); // mata-mata de jogo único: cada vitória vale mais
  cup.alive = [...winners, ...cup.byes];
  cup.pending = []; cup.byes = []; cup.round++;
  if (cup.alive.length === 1) {
    cup.champ = cup.alive[0];
    const bonus = cup.id === 'EU' ? 15e6 : 2e6;
    C(cup.champ).cash += bonus;
    if (cup.id === 'EU') { addRank(cup.champ, 60); (S.champs.EU ??= []).unshift({year: S.year, id: cup.champ}); }
    if (cup.champ === S.man.club && cup.id === 'EU') unlock('intl');
    if (cup.champ === S.man.club) { S.fin.prem += bonus; S.man.titles.push(`${cup.name} ${S.year}`); S.man.rep = clamp(S.man.rep + (cup.id === 'EU' ? 15 : 6), 0, 100); }
    news(`🏆 ${C(cup.champ).name} é campeão da ${cup.name}!`);
  }
}

// ===================== Torneios internacionais =====================
// Libertadores e Sul-Americana: 8 grupos de 4 (turno e returno) e mata-mata em ida e volta, final única.
// Sul-Americana: 1º de cada grupo vai às oitavas; os 2º enfrentam os 3º da Libertadores nos playoffs.
// Super Mundial (a cada 4 anos): 8 grupos de 4 (turno único) e mata-mata em jogo único.
// Mundial de Clubes (anual): campeão da Copa dos Campeões x campeão da Libertadores.
const CONMEBOL = new Set(D.leagues.filter(l => l.conf === 'CONMEBOL').map(l => l.id));
const isSA = c => CONMEBOL.has(c.lg);
const countryKey = c => c.lg;
const clubCountry = c => c.country || LEAGUES[c.lg]?.country || '';
const clubWhere = c => divName(S.divs[divKey(c.lg, c.tier)]);
const smwYear = y => (y - 2025) % 4 === 0;
const G6 = ['G0', 'G1', 'G2', 'G3', 'G4', 'G5'];
const TOURS = {
  LIB: {name:NAMES.LIB, plan:[...G6, 'R16a', 'R16b', 'QFa', 'QFb', 'SFa', 'SFb', 'F'], mult:.6, titles:2,
        rank:{G:5, R16:8, QF:12, SF:18, F:26, W:60}, prize:{G:1.5e6, R16:1.2e6, QF:1.7e6, SF:2.5e6, F:7e6, W:18e6}},
  SUL: {name:NAMES.SUL, plan:[...G6, 'POa', 'POb', 'R16a', 'R16b', 'QFa', 'QFb', 'SFa', 'SFb', 'F'], mult:.3, titles:1,
        rank:{G:2, PO:2, R16:4, QF:6, SF:9, F:13, W:30}, prize:{G:.5e6, PO:.4e6, R16:.6e6, QF:.8e6, SF:1.2e6, F:3e6, W:6e6}},
  SMW: {name:NAMES.SMW, plan:['G0', 'G1', 'G2', 'R16', 'QF', 'SF', 'F'], mult:1.5, titles:3,
        rank:{G:10, R16:15, QF:22, SF:30, F:40, W:100}, prize:{G:9e6, R16:7e6, QF:13e6, SF:21e6, F:30e6, W:40e6}},
  INT: {name:NAMES.INT, plan:['F'], mult:1.5, titles:2, rank:{F:15, W:50}, prize:{F:3e6, W:5e6}},
};
const COMP_NAME = NAMES;
const STAGE_LABEL = {R16:'Oitavas de final', QF:'Quartas de final', SF:'Semifinal', F:'Final', PO:'Playoffs'};
const stageBase = c => c[0] === 'G' ? 'G' : c.replace(/[ab]$/, '');
const stageLabel = c => c[0] === 'G' ? `Fase de grupos · ${+c[1] + 1}ª rodada` : STAGE_LABEL[stageBase(c)] + (c.endsWith('a') ? ' (ida)' : c.endsWith('b') ? ' (volta)' : '');

function addRank(id, pts) { if (pts > 0) S.rank.cur[id] = Math.round(((S.rank.cur[id] || 0) + pts) * 10) / 10; }
// Temporada atual vale 100%; as três anteriores, 75%, 50% e 25%
const RANK_W = [.75, .5, .25];
const rankTotal = id => (S.rank.cur[id] || 0) + S.rank.hist.reduce((s, h, i) => s + (h[id] || 0) * (RANK_W[i] || 0), 0);
const rankList = () => Object.values(S.clubs).map(c => [c.id, rankTotal(c.id)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
const seed = (a, b) => rankTotal(a) >= rankTotal(b) ? [a, b] : [b, a]; // [melhor (decide em casa), pior]

// Chegar a uma fase rende pontos de ranking e premiação
function reach(t, ids, stage) {
  const T = TOURS[t.id];
  for (const id of ids) {
    addRank(id, T.rank[stage] || 0);
    const prize = T.prize[stage] || 0;
    C(id).cash += prize;
    if (id === S.man?.club) S.fin.prem += prize;
  }
}
function drawGroups(t) {
  const n = t.teams.length / 4, sorted = [...t.teams].sort((a, b) => rankTotal(b) - rankTotal(a) || C(b).rep - C(a).rep);
  t.groups = Array.from({length: n}, () => []);
  for (let pot = 0; pot < 4; pot++) {
    for (const id of shuffle(sorted.slice(pot * n, pot * n + n))) {
      const open = shuffle(t.groups.filter(g => g.length === pot));
      (open.find(g => !g.some(x => countryKey(C(x)) === countryKey(C(id)))) || open[0]).push(id);
    }
  }
}
function newTour(id, teams) {
  const T = TOURS[id];
  const t = {id, name:T.name, plan:T.plan, step:0, teams:[...teams], alive:[...teams], groups:[], gtbl:{}, gfx:[], glog:[],
    pairs:[], first:[], direct:[], thirds:[], log:[], champ:null, runner:null};
  if (T.plan[0][0] === 'G') {
    drawGroups(t);
    const rounds = T.plan.filter(c => c[0] === 'G').length;
    const per = t.groups.map(g => roundRobin(g).slice(0, rounds));
    for (let r = 0; r < rounds; r++) t.gfx.push(per.flatMap(g => g[r]));
    for (const c of teams) t.gtbl[c] = {j:0, v:0, e:0, d:0, gp:0, gc:0, pts:0};
    reach(t, teams, 'G');
  } else {
    t.pairs = [seed(teams[0], teams[1])];
    reach(t, teams, 'F');
  }
  return t;
}
function tourMatches(t) {
  if (!t || t.champ || t.step >= t.plan.length) return [];
  const code = t.plan[t.step], meta = {comp:'T', tour:t.id, key:t.id, stage:code};
  if (code[0] === 'G') return t.gfx[+code[1]].map(([h, a]) => mkMatch(h, a, meta));
  if (code.endsWith('a')) return t.pairs.map(([hi, lo]) => mkMatch(lo, hi, meta));
  if (code.endsWith('b')) return t.pairs.map(([hi, lo], i) => mkMatch(hi, lo, {...meta, ko:true, agg:t.first[i]}));
  return t.pairs.map(([hi, lo]) => mkMatch(hi, lo, {...meta, ko:true, neutral: t.id === 'SMW' || code === 'F'}));
}
function closeGroups(t) {
  const st = t.groups.map(g => standings({clubs: g, tbl: t.gtbl}));
  const firsts = st.map(s => s[0]), seconds = st.map(s => s[1]);
  const gi = id => t.groups.findIndex(g => g.includes(id));
  if (t.id === 'SUL') {
    const thirds = S.tours.LIB?.thirds || [];
    t.direct = firsts;
    reach(t, firsts, 'R16');
    const sec = shuffle([...seconds]);
    t.pairs = thirds.length === sec.length ? thirds.map((x, i) => [x, sec[i]]) : sec.map((x, i) => i % 2 ? null : [x, sec[i + 1]]).filter(Boolean);
    t.teams.push(...thirds);
    t.alive = [...firsts, ...seconds, ...thirds];
    reach(t, [...seconds, ...thirds], 'PO');
    return;
  }
  if (t.id === 'LIB') t.thirds = st.map(s => s[2]);
  // Oitavas: 1º colocado x 2º de outro grupo; o 1º decide em casa
  let sec = seconds;
  for (let k = 0; k < 200; k++) { sec = shuffle([...seconds]); if (firsts.every((f, i) => gi(f) !== gi(sec[i]))) break; }
  t.pairs = firsts.map((f, i) => [f, sec[i]]);
  t.alive = [...firsts, ...seconds];
  reach(t, t.alive, 'R16');
}
function crown(t) {
  const c = C(t.champ);
  reach(t, [t.champ], 'W');
  c.titles += TOURS[t.id].titles;
  (S.champs[t.id] ??= []).unshift({year: S.year, id: t.champ});
  S.history.unshift({year: S.year, lg: t.id, c1: c.name, c2: C(t.runner).name, cup: ''});
  news(`🏆 ${c.name} é campeão da ${t.name}!`);
  if (t.champ === S.man.club) unlock('intl');
  if (t.champ === S.man.club) { S.man.titles.push(`${t.name} ${S.year}`); S.man.rep = clamp(S.man.rep + (t.id === 'SUL' ? 8 : 15), 0, 100); }
}
function tourAfter(t, ms) {
  if (!t || t.champ || t.step >= t.plan.length) return;
  const code = t.plan[t.step], mult = TOURS[t.id].mult;
  for (const m of ms) {
    if (m.gh > m.ga) addRank(m.h, 3 * mult); else if (m.ga > m.gh) addRank(m.a, 3 * mult); else { addRank(m.h, mult); addRank(m.a, mult); }
  }
  if (code[0] === 'G') {
    for (const m of ms) { tblAdd(t.gtbl, m); t.glog.push([m.h, m.a, m.gh, m.ga]); }
    if (t.plan[t.step + 1]?.[0] !== 'G') closeGroups(t);
  } else if (code.endsWith('a')) {
    t.first = ms.map(m => [m.ga, m.gh]); // gols de quem decide em casa, gols do outro
    t.log.push({name: stageLabel(code), games: ms.map(m => [m.h, m.a, m.gh, m.ga, null, null])});
  } else {
    const winners = ms.map(winner);
    t.log.push({name: stageLabel(code), games: ms.map(m => [m.h, m.a, m.gh, m.ga, m.pen, m.agg ? totals(m) : null])});
    if (code === 'F') {
      t.champ = winners[0];
      t.runner = winners[0] === ms[0].h ? ms[0].a : ms[0].h;
      t.alive = [t.champ];
      crown(t);
    } else {
      if (stageBase(code) === 'PO') {

      } else {
        t.alive = winners;
        t.pairs = [];
        for (let i = 0; i < winners.length; i += 2) t.pairs.push(seed(winners[i], winners[i + 1]));

// Vagas da 1ª temporada: participantes reais de 2026; depois, pela classificação (ver endSeason)
function completeSA(lib, sul) {
  const used = new Set([...lib, ...sul]);
  const extra = Object.values(S.clubs).filter(c => isSA(c) && !used.has(c.id) && c.tier === 1).sort((a, b) => b.rep - a.rep).map(c => c.id);
  while (lib.length < 32 && extra.length) lib.push(extra.shift());
  while (sul.length < 32 && extra.length) sul.push(extra.shift());
  return {LIB: lib.slice(0, 32), SUL: sul.slice(0, 32)};
}
function firstSA() {
  const lib = [], sul = [];
  for (const lg of CONMEBOL) {
    const ids = S.divs[divKey(lg, 1)].clubs.slice().sort((a, b) => C(b).rep - C(a).rep);
    const nl = (LIB_Q[lg] || 1) + (lg === 'BR1' || lg === 'AR1' ? 1 : 0);
    lib.push(...ids.slice(0, nl)); sul.push(...ids.slice(nl, nl + (SUL_Q[lg] || 2)));
  }
  return completeSA(lib, sul);
}
// Super Mundial: 12 vagas da Europa e 6 da América do Sul (campeões continentais dos últimos 4 anos + ranking,
// máximo 2 por país salvo campeões). As 14 vagas das outras confederações, que não existem no jogo, vão 7/7 pelo ranking (até 4 por país).
function smwTeams() {
  const pickConf = (inConf, champKey, official, extra) => {
    const out = [], per = {};
    const add = id => { out.push(id); const k = countryKey(C(id)); per[k] = (per[k] || 0) + 1; };
    for (const {id, year} of S.champs[champKey] || []) if (year >= S.year - 4 && C(id) && !out.includes(id)) add(id);
    const ranked = Object.values(S.clubs).filter(inConf).map(c => c.id).sort((a, b) => rankTotal(b) - rankTotal(a) || C(b).rep - C(a).rep);
    const fill = (total, cap) => { for (const id of ranked) { if (out.length >= total) break; if (!out.includes(id) && (per[countryKey(C(id))] || 0) < cap) add(id); } };
    fill(official, 2);
    fill(Math.max(out.length, official) + extra, 4);
    return out;
  };
  return [...pickConf(c => LEAGUES[c.lg].conf === 'UEFA', 'EU', 12, 7), ...pickConf(isSA, 'LIB', 6, 7)].slice(0, 32);
}

// ===================== Rodada =====================
function slotMatches() {
  const ev = S.cal[S.slot], list = [];
  if (ev.t === 'L') {
    for (const d of Object.values(S.divs)) {
      const j = d.roundAt[ev.i];
      if (j == null) continue;
      for (const [h, a] of d.fx[j]) list.push(mkMatch(h, a, {comp:'L', div:d.key, key:d.key, round:j}));
    }
  } else if (ev.t === 'C' || ev.t === 'E') {
    const cups = ev.t === 'C' ? Object.values(S.cups.nat) : [S.cups.euro];
    for (const cup of cups) for (const [h, a] of drawCup(cup))
      list.push(mkMatch(h, a, {comp:ev.t, cup:cup.id, key:cup.id, rname:cup.rname, ko:true, neutral: cup.id === 'EU' && cup.alive.length === 2}));
  } else {
    if (ev.t === 'M') {
      const eu = S.cups.euro.champ, lib = S.tours.LIB?.champ;
      if (eu && lib && eu !== lib) S.tours.INT = newTour('INT', [eu, lib]);
    }
    for (const id of slotTourIds(ev)) list.push(...tourMatches(S.tours[id]));
  }

}

function advance() {

  }
  if (!S.sponsor) {
    S.sponsor = S.sponsorOffers[0];

  }

  club.bench = club.bench.filter(id => club.pl.includes(id));

  if (errs.length) {
    openDlg(`<h2 id="dlg-title">Escalação inválida</h2><ul>${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul>
      <div class="row"><button class="primary" data-act="autoAndGo">Escalar automaticamente e jogar</button>
      <button data-act="goSquad">Corrigir no elenco</button></div>`);

function finishSlot(matches, um) {

  for (const [id, ms] of Object.entries(byCup)) finishCupRound(getCup(id), ms);
  const ev = S.cal[S.slot];
  for (const id of slotTourIds(ev)) tourAfter(S.tours[id], matches.filter(m => m.tour === id)); // LIB antes da SUL (3º colocados)
  S.man.recap = recapLine(um, ev, matches);

  UI.screen = 'results';
  save();

function postSlot(ev) {
  const me = S.man.club;
  for (const p of Object.values(S.players)) { p.en = Math.min(100, p.en + 15); if (p.inj > 0) p.inj--; }
  const wk = 49 / S.cal.length; // salário e patrocínio são "por semana" de um calendário-base de 49 datas
  for (const c of Object.values(S.clubs)) {
    const wages = Math.round(weeklyWages(c) * wk), interest = Math.round(c.debt * .008);
    const spon = Math.round((c.id === me && S.sponsor ? S.sponsor.week : c.spon) * wk);
    c.cash += spon - wages - interest;
    if (c.id === me) { S.fin.pat += spon; S.fin.sal += wages; S.fin.jur += interest; }
  }
  // Propostas com prazo vencem; véspera do último dia da janela traz as ofertas relâmpago
  for (const m of S.inbox) if (m.exp != null && !m.done && S.slot >= m.exp) m.done = 'expirou';

  if (!isCareer() && S.man.wage) S.man.money += Math.round(S.man.wage * wk);
  if (isCareer()) {
    const p = me_p();
    S.man.money += Math.round(p.sal * wk);
    if (isWindow(S.slot)) { aiTransfers(); playerOffers(); }
    S.slot++;
    return;
  }
  if (isWindow(S.slot)) { aiTransfers(); offersForUser(); }
  // Diretoria: avalia posição na tabela a cada 6 rodadas e o caixa
  const club = myClub();
  if (ev.t === 'L' && ev.i % 6 === 5) {
    const pos = standings(S.divs[divKey(club.lg, club.tier)]).indexOf(club.id) + 1;
    S.man.conf = clamp(S.man.conf + (pos <= S.man.obj.target ? 4 : pos > S.man.obj.target + 3 ? -6 : 0), 0, 100);
  }
  if (club.cash < 0) S.man.conf = clamp(S.man.conf - 2, 0, 100);
  if (S.slot === S.cal.length - 9) {
    const exp = club.pl.map(P).filter(p => p.ct <= 1);
    if (exp.length) mail({type:'info', text:`Contratos terminando no fim da temporada: ${exp.map(p => p.n).join(', ')}. Renove pelo elenco ou eles sairão de graça.`});
  }
  // Propostas de emprego de clubes maiores
  if (rnd() < .04 && S.man.rep > club.rep + 8) {
    const cands = Object.values(S.clubs).filter(c => c.id !== me && c.lg !== 'SA' && c.rep > club.rep + 4 && c.rep <= S.man.rep + 5);
    if (cands.length) { const c = pick(cands); mail({type:'job', club:c.id, text:`O ${c.name} (${LEAGUES[c.lg].country}) quer contratar você como treinador.`}); }
  }
  S.slot++;
  if (S.man.conf <= 0 && !ownsClub(club.id)) fire('A diretoria perdeu a confiança no seu trabalho.');
}

function aiTransfers() {
  const me = coachClub(), clubs = Object.values(S.clubs).filter(c => c.id !== me);
  const all = Object.values(S.players).filter(p => p.id !== S.man.pid); // o jogador do Modo Carreira decide o próprio destino
  for (let k = 0; k < 5; k++) {
    // Clubes do jogador (presidente) usam o caixa aportado com mais frequência
    const mineOwned = (S.man.owned || []).map(o => C(o.id)).filter(c => c && c.id !== me);
    const buyer = mineOwned.length && rnd() < .3 ? pick(mineOwned) : pick(clubs);
    if (buyer.cash < 1e6 || buyer.pl.length >= 32) continue;
    const avg = clubAvg(buyer);
    const counts = {}; for (const pos of POS) counts[pos] = buyer.pl.filter(id => P(id).p === pos && P(id).r >= avg - 3).length;
    const need = POS.slice(1).sort((a, b) => counts[a] / FORMS['4-4-2'][a] - counts[b] / FORMS['4-4-2'][b] || 0)[0] || 'M';
    let best = null;
    for (let t = 0; t < 60; t++) {
      const p = pick(all);
      if (p.p !== need || p.club === me || p.club === buyer.id || p.r < avg - 1 || p.r > avg + 6) continue;
      if (p.club && C(p.club).pl.length <= 18) continue;
      const fee = p.club ? Math.round(p.v * 1.1) : 0;
      if (fee > buyer.cash * .6) continue;
      if (!best || p.r > best.r) best = p;
    }
    if (!best) continue;
    const fee = best.club ? Math.round(best.v * 1.1) : 0;
    const from = best.club ? C(best.club) : null;
    if (from) from.cash += fee;
    buyer.cash -= fee;
    movePlayer(best, buyer.id);
    recordTransfer(best, from?.id, buyer.id, fee);
    best.sal = salaryFor(best.v); best.ct = ri(2, 4);
    if (best.r >= 78) headline('transfer', {to: buyer.name, p: best.n, from: from ? from.name : 'livre', fee: money(fee)});
    while (buyer.pl.length > 32) {
      const worst = buyer.pl.map(P).filter(p => p.id !== S.man.pid).sort((a, b) => a.r - b.r)[0];
      detach(worst);
    }
  }
}
function offersForUser() {
  const club = myClub(), avg = clubAvg(club);
  for (const id of club.pl) {
    const p = P(id);
    let amount = 0;
    if (p.sell && rnd() < .3) amount = niceRound(p.sell * (.8 + rnd() * .3));
    else if (!p.sell && p.r >= avg + 3 && rnd() < .03) amount = niceRound(p.v * (1.1 + rnd() * .4));
    if (!amount) continue;
    const buyers = Object.values(S.clubs).filter(c => c.id !== club.id && c.cash > amount && clubAvg(c) >= p.r - 8);
    if (!buyers.length) continue;
    const b = pick(buyers);
    mail({type:'offer', pid:id, from:b.id, amount, text:`O ${b.name} oferece ${money(amount)} por ${p.n}.`});
  }
}

// ===================== Modo Carreira =====================
// Clubes interessados: nível parecido ou um pouco acima do jogador; quem joga e faz gols atrai os maiores
function careerSuitors(p, n) {
  const cur = p.club ? C(p.club) : null, form = Math.min(4, p.g / 4 + p.ap / 15);
  const cands = Object.values(S.clubs).filter(c => c.id !== p.club && c.lg !== 'SA' && c.pl.length < 32

}
function careerOffer(p, c) {

}
function playerOffers() {

// ===================== Fim de temporada =====================
// Modo Carreira: balanço do ano, evolução (jogar com frequência acelera), contrato e aposentadoria aos 40
function careerSeasonEnd(lines) {
  careerInit();
  const p = me_p(), club = myClub();
  S.man.stats.ap += p.ap; S.man.stats.g += p.g;
  S.man.seasons.unshift({year: S.year, club: club.name, ap: p.ap, g: p.g, r: p.r, nw: netWorth()});
  if (S.man.stats.g >= 100) unlock('g100');
  lines.push(`⚽ Sua temporada: ${p.ap} jogos e ${p.g} gols pelo ${club.name}.`);
  wealthSeasonEnd(lines);
  const before = p.r;
  p.a++;
  if (p.r < p.pt) p.r = Math.min(p.pt, p.r + (p.a <= 21 ? ri(2, 6) : p.a <= 24 ? ri(1, 4) : ri(0, 2)));
  if (p.ap >= 15 && p.a <= 30 && rnd() < .7) { p.r++; p.pt = Math.max(p.pt, p.r); }
  if (p.a >= 31) p.r -= ri(0, 3);
  if (p.a >= 34) p.r -= ri(1, 4);
  const tn = S.man.train.n;
  if (tn) { // treino particular pago pelo jogador
    const g = clamp(Math.min(TRAIN_CAP, p.pt + 2) - p.r, 0, tn); // acelera até o potencial e passa dele no máximo 2 pontos
    p.r += g; p.pt = Math.max(p.pt, p.r); S.man.trainTotal += tn;
    lines.push(`🏋️ Treino particular: ${g ? `+${g} de força` : 'segurou a forma física'}.`);
  }
  p.r = clamp(p.r, 35, 95); p.v = valueOf(p); p.en = 100; p.sus = 0;
  lines.push(`📈 Sua força: ${before} → ${p.r} (${p.a} anos).`);
  if (p.a >= 40) { p.ap = p.g = 0; retire(); lines.push('👋 Aos 40 anos, você pendurou as chuteiras.'); return; }
  if (salaryFor(p.v) > p.sal * 1.5) { p.sal = salaryFor(p.v); lines.push(`💶 O ${club.name} reajustou seu salário para ${money(p.sal)}/semana.`); }
  if (--p.ct > 0) { if (p.ct === 1) lines.push('📄 Seu contrato termina no fim da próxima temporada.'); }
  else if (p.r >= clubAvg(club, 16) - 5 || ownsClub(club.id)) { // o dono do clube sempre renova
    p.ct = ri(2, 4); p.sal = Math.max(p.sal, salaryFor(p.v));
    lines.push(`📄 O ${club.name} renovou seu contrato por ${p.ct} anos (${money(p.sal)}/semana).`);
  } else {
    detach(p); S.man.prev = club.id; S.man.club = 0;
    S.man.history.push(`${S.year}: deixou o ${club.name} (fim de contrato)`);
    lines.push('📄 Seu contrato terminou e o clube não renovou. Escolha seu próximo clube.');
  }
  if (p.a >= 33 && !S.man.retired) lines.push('🧓 Você já pode encerrar a carreira quando quiser, na aba Carreira.');
}
function endSeason() {
  const me = S.man.club, lines = [];
  const club = myClub(), myDiv = S.divs[divKey(club.lg, club.tier)];
  const myPos = standings(myDiv).indexOf(me) + 1;
  const career = isCareer(), mine = coachClub(), pid = S.man.pid;
  const ok = !career && myPos <= S.man.obj.target;
  const awLines = []; seasonAwards(awLines); xiSeasonEnd(awLines); seasonGoalsEnd(awLines); rivalSeasonEnd(awLines); // antes do acesso e rebaixamento mexerem nas divisões
  const euroNext = [], thirds = [], saLib = [], saSul = [];
  for (const lg of Object.keys(LEAGUES)) {
    const d1 = S.divs[divKey(lg, 1)], d2 = S.divs[divKey(lg, 2)], t1 = standings(d1), t2 = standings(d2), k = promoCount(lg);
    const lgRep = d1.clubs.reduce((s, id) => s + C(id).rep, 0) / d1.clubs.length;
    t1.forEach((id, i) => { const v = Math.round((t1.length - i) * 4e5 * (1 + lgRep / 50)); C(id).cash += v; if (id === me) S.fin.prem += v; });
    t2.forEach((id, i) => { const v = (t2.length - i) * 8e4; C(id).cash += v; if (id === me) S.fin.prem += v; });
    S.history.unshift({year:S.year, lg, c1:C(t1[0]).name, c2: t2.length ? C(t2[0]).name : '-', cup: S.cups.nat[lg].champ ? C(S.cups.nat[lg].champ).name : '-'});
    if (t1[0] === me) { S.man.titles.push(`${LEAGUES[lg].name} ${S.year}`); S.man.rep = clamp(S.man.rep + 12, 0, 100); if (C(me).rep < 60) unlock('small'); }
    if (t2[0] === me) S.man.titles.push(`${LEAGUES[lg].name2 || `Divisão de Acesso (${LEAGUES[lg].country})`} ${S.year}`);
    // Desempenho para a reputação, relativo ao nível da liga: meio de tabela = média da liga
    const lgSq = d1.clubs.reduce((s, id) => s + squadScore(C(id)), 0) / d1.clubs.length;
    t1.forEach((id, i) => C(id).perf.unshift(clamp(lgSq + 30 - 60 * i / (t1.length - 1), 0, 100)));
    t2.forEach((id, i) => C(id).perf.unshift(clamp(lgSq * .5 + 15 - 30 * i / (t2.length - 1), 0, 100)));
    const cupC = S.cups.nat[lg].champ;
    C(t1[0]).titles++;
    if (cupC) C(cupC).titles++;
    // Títulos nacionais pesam pouco perto dos internacionais (ajustados pela força da liga)
    const ls = lgRep / 70;
    addRank(t1[0], 8 * ls); addRank(t1[1], 4 * ls);
    if (cupC) addRank(cupC, 4 * ls);
    if (CONMEBOL.has(lg)) {
      // Brasil: G6 + campeão da Copa do Brasil; Argentina: 5 primeiros + campeão da Copa Argentina; demais países pela tabela.
      const n = LIB_Q[lg] || 1, lib = t1.slice(0, n);
      if (lg === 'BR1' || lg === 'AR1') lib.push(cupC && !lib.includes(cupC) ? cupC : t1[n]);
      saLib.push(...lib);
      saSul.push(...t1.filter(id => !lib.includes(id)).slice(0, SUL_Q[lg] || 2));
    } else if (LEAGUES[lg].conf === 'UEFA') {
      // Copa dos Campeões: campeões de todos os países; vices e 3ºs pela força da liga, até 32
      euroNext.push(t1[0]);
      thirds.push([lgRep + 100, t1[1]], [lgRep, t1[2]]);
    }
    const down = k ? t1.slice(-k) : [], up = t2.slice(0, k);
    d1.clubs = d1.clubs.filter(id => !down.includes(id)).concat(up);
    d2.clubs = d2.clubs.filter(id => !up.includes(id)).concat(down);
    if (lg === club.lg) {
      if (down.includes(me)) lines.push('😞 Seu time foi rebaixado.');
      if (up.includes(me)) lines.push('🎉 Seu time conseguiu o acesso à primeira divisão!');
      lines.push(`Campeão (${LEAGUES[lg].name}): ${C(t1[0]).name} · Acesso: ${up.map(id => C(id).name).join(', ')}`);
    }
  }
  thirds.sort((a, b) => b[0] - a[0]).forEach(x => { if (euroNext.length < 32 && x[1]) euroNext.push(x[1]); });
  S.euroNext = euroNext;
  // Campeões da Libertadores e da Sul-Americana garantem vaga na próxima Libertadores
  for (const c of [S.tours.LIB?.champ, S.tours.SUL?.champ]) if (c && !saLib.includes(c)) { saLib.push(c); const i = saSul.indexOf(c); if (i >= 0) saSul.splice(i, 1); }
  S.saNext = completeSA(saLib, saSul);
  if (S.cups.euro.champ) S.history.unshift({year:S.year, lg:'EU', c1:C(S.cups.euro.champ).name, c2:'', cup:''});
  if (career) lines.unshift(`${club.name} terminou em ${myPos}º.`);
  else {
    lines.unshift(`Você terminou em ${myPos}º. Objetivo: ${S.man.obj.text} — ${ok ? '✅ cumprido' : '❌ não cumprido'}.`);
    S.man.conf = clamp(S.man.conf + (ok ? 20 : -25), 0, 100);
    S.man.rep = clamp(S.man.rep + (ok ? 6 : -5), 5, 100);
  }
  if (S.cups.euro.champ) C(S.cups.euro.champ).titles += 2;
  if (ok && S.sponsor?.goal) { club.cash += S.sponsor.goal; S.fin.pat += S.sponsor.goal; lines.push(`💰 ${S.sponsor.n} pagou o bônus de objetivo: ${money(S.sponsor.goal)}.`); }

  lines.push(...awLines);
  seasonRecords();
  nationalSeasonEnd(lines);
  if (career) careerSeasonEnd(lines, myPos);
  else if (S.man.money != null) { wealthSeasonEnd(lines); S.man.wage = coachWage(S.man.rep); }
  // Jogadores: idade, evolução, contratos e aposentadoria
  for (const p of Object.values(S.players)) {
    if (p.id === pid && career) continue; // tratado em careerSeasonEnd
    p.a++;
    if (p.r < p.pt) p.r = Math.min(p.pt, p.r + (p.a <= 21 ? ri(2, 6) : p.a <= 24 ? ri(1, 4) : ri(0, 2)));
    if (p.a >= 31) p.r -= ri(0, 3);
    if (p.a >= 34) p.r -= ri(1, 4);
    p.r = clamp(p.r, 35, 95);
    p.v = valueOf(p);
    p.en = 100; p.sus = 0;
    if ((p.a >= 35 && rnd() < .35) || p.a >= 39) {
      if (mine && p.club === mine) lines.push(`👋 ${p.n} se aposentou.`);
      legendRetires(p, lines);
      hofCheck(p); removePlayer(p); continue;
    }
    if (!p.club) continue;
    p.ct--;
    if (p.ct <= 0) {
      if (p.club !== mine && rnd() < .75) { p.ct = ri(1, 3); p.sal = salaryFor(p.v); }
      else { if (p.club === mine) lines.push(`📄 ${p.n} saiu: contrato terminou.`); detach(p); }
    }
  }
  // Base, enxugamento e reposição dos elencos
  const free = () => Object.values(S.players).filter(p => !p.club && p.id !== pid).sort((a, b) => b.r - a.r);
  for (const c of Object.values(S.clubs)) {
    const avg = clubAvg(c);
    for (let i = 0; i < 2; i++) {
      const y = genPlayer(c.id, pick(['G', 'L', 'Z', 'Z', 'M', 'M', 'M', 'A', 'A']), avg - ri(12, 20), ri(16, 18));
      y.ct = 3;
      if (c.id === mine) lines.push(`🌱 Da base: ${y.n} (${POS_NAME[y.p]}, ${y.a} anos, força ${y.r}).`);
    }
    if (c.id === mine) {
      const before = c.pl.length;
      fillSquad(c, avg - 6);
      if (c.pl.length > before) lines.push(`🧒 ${c.pl.length - before} juniores subiram para completar o elenco mínimo.`);
      continue;
    }
    while (c.pl.length > 30) detach(c.pl.map(P).filter(p => p.id !== pid).sort((a, b) => a.r - b.r)[0]);
    if (c.pl.length < 20) {
      const f = free().filter(p => p.r <= avg + 2);
      while (c.pl.length < 20 && f.length) { const p = f.shift(); movePlayer(p, c.id); p.ct = ri(1, 3); p.sal = salaryFor(p.v); }
    }
    fillSquad(c, avg - 4);
  }
  newPhenoms(lines);
  clubFortunes(lines);
  const fa = free();
  for (const p of fa.slice(500)) delete S.players[p.id];
  // Reputação dos clubes: avisa mudanças de patamar do seu clube e da 1ª divisão do seu país
  for (const c of Object.values(S.clubs)) {
    c.perf.length = Math.min(c.perf.length, 3);
    const before = repTier(c.rep);
    c.rep = calcReputation(c);
    c.mor = Math.round((c.mor + 60) / 2); // nova temporada, ânimo renovado
    const after = repTier(c.rep);
    if (before !== after && (c.id === me || (c.lg === club.lg && c.tier === 1)))
      headline(REP_TIERS.findIndex(t => t[1] === after) < REP_TIERS.findIndex(t => t[1] === before) ? 'repUp' : 'repDown', {c: c.name, t: after.toLowerCase()});
    if (c.id === me && before !== after) lines.push(`⭐ Reputação do clube: ${before} → ${after}.`);
  }
  // Diretoria
  const relegated = club.tier === 1 && S.divs[divKey(club.lg, 2)].clubs.includes(me);
  if (!career && !ownsClub(me) && (S.man.conf < 30 || (relegated && S.man.conf < 45))) {
    fire('A diretoria decidiu não renovar com você após a temporada.');
    lines.push('🚪 Você foi demitido.');
  }
  if (!career) S.man.history.push(`${S.year}: ${club.name} — ${myPos}º lugar`);
  const rpos = rankList().findIndex(x => x[0] === me) + 1;
  if (rpos) lines.push(`🌎 Ranking Mundial de Clubes: seu clube está em ${rpos}º.`);
  // Ranking: janela de 4 temporadas (a atual + as 3 anteriores)
  S.rank.hist.unshift(S.rank.cur);
  S.rank.hist.length = Math.min(S.rank.hist.length, 3);
  S.rank.cur = {};
  S.rank.prev = Object.fromEntries(rankList().map(([id], i) => [id, i + 1]));
  UI.summary = {year: S.year, lines};
  S.year++;
  startSeason();
  save();
}

// ===================== Premiações da temporada =====================
// Em cada 1ª divisão e no mundo: melhor jogador, revelação (até 21 anos), artilheiro e goleiro menos vazado;
// na liga também o técnico do ano (clube que mais superou a expectativa). O melhor do mundo é o prêmio maior.

const AWARD_PRIZE = {best:[3e5, 2e6], young:[1e5, 5e5], top:[1.5e5, 8e5], gk:[1e5, 5e5]}; // [liga, mundo], em euros
const GOAL_W = {G:0, L:1, Z:1, M:.7, A:.5};
// Time do Ano: entra no resumo da temporada e na galeria
function xiSeasonEnd(lines) {
  const y = S.awards?.[0];

  const pid = isCareer() ? S.man.pid : 0, me = coachClub(), lg = myClub()?.lg;
  for (const [xi, world] of [[y.xi.world, 1], [y.xi.lg[lg] || [], 0]]) {
    const where = world ? 'do mundo' : `(${LEAGUES[lg].country})`;
    if (pid && xi.some(x => x.pid === pid)) {

function seasonAwards(lines) {

    const young = all.filter(c => c.p.a <= 21);

// ===================== Rivalidades =====================
// Rival: clube da mesma cidade e liga; sem vizinho, o de reputação mais parecida na mesma divisão
function rivalOf(id) {
  S.rivals ??= {};

  const c = C(id);
  let r = 0;
  const same = Object.values(S.clubs).filter(x => x.id !== id && x.lg === c.lg && c.city && x.city === c.city);
  if (same.length) r = same.sort((a, b) => b.rep - a.rep)[0].id;
  else {
    const cands = Object.values(S.clubs).filter(x => x.id !== id && x.lg === c.lg && x.tier === c.tier);
    if (cands.length) r = cands.sort((a, b) => Math.abs(a.rep - c.rep) - Math.abs(b.rep - c.rep))[0].id;
  }
  return S.rivals[id] = r;
}
const isDerby = (h, a) => rivalOf(h) === a || rivalOf(a) === h;

// Depois de cada jogo do clube do jogador: conquistas, sequência invicta, torcida e capitão
function myMatchDone(m) {
  const me = S.man.club, side = m.h === me ? 0 : 1, c = C(me);
  const gf = side ? m.ga : m.gh, ga = side ? m.gh : m.ga, w = winner(m), derby = isDerby(m.h, m.a);
  const won = gf > ga || (gf === ga && w === me), lost = gf < ga || (gf === ga && w && w !== me);
  const goals = {};
  for (const e of m.ev) if (e.t === 'goal' && e.i === side) goals[e.id] = (goals[e.id] || 0) + 1;
  if (isCareer() ? goals[S.man.pid] >= 3 : Object.values(goals).some(n => n >= 3)) unlock('hat');
  if (gf - ga >= 5) unlock('rout');
  if (derby && won) unlock('derby');
  S.man.unb = lost ? 0 : (S.man.unb || 0) + 1;
  S.man.bestUnb = Math.max(S.man.bestUnb || 0, S.man.unb);
  if (S.man.unb >= 10) unlock('unb10');
  // Torcida: resultado (clássico vale o dobro) e, em casa, o preço do ingresso
  c.fans ??= 60;
  let f = (won ? 3 : lost ? -3 : 0) * (derby ? 2 : 1);
  if (side === 0 && c.ref) { const pr = c.price / c.ref; f += pr > 1.3 ? -1.5 : pr < .9 ? .5 : 0; }
  c.fans = clamp(Math.round((c.fans + f) * 10) / 10, 0, 100);

// ===================== Momentos decisivos e palestra (jogo ao vivo) =====================
function maybeMoment(L) {

  if (!t) return false;
  const s = m.s[t === 'penD' ? 1 - i : i];
  const shooter = s.on.map(P).filter(p => p.p !== 'G').sort((a, b) => (b.tr === 'cob') - (a.tr === 'cob') || (b.p === 'A') - (a.p === 'A') || b.r - a.r)[0];
  if (!shooter && t !== 'last') return false;

  L.moments = (L.moments || 0) + 1;

}
function momentBox(L) {

  const q = {
    pen: [`⚽ Pênalti para você! ${esc(sh.n)} (força ${sh.r}) vai bater. Onde?`, btn('e', '↖ Canto esquerdo') + btn('m', '⬆ No meio') + btn('d', '↗ Canto direito')],
    penD: [`😬 Pênalti contra! ${esc(sh.n)} vai bater. Para onde o goleiro pula?`, btn('e', '↖ Esquerda') + btn('m', '⬆ Fica no meio') + btn('d', '↗ Direita')],
    fk: [`🎯 Falta perigosa na entrada da área. ${esc(sh.n)} está na bola (força ${sh.r}).`, btn('chute', 'Chutar direto') + btn('cruz', 'Cruzar na área')],
    last: ['⏱️ Reta final e o resultado não serve. O que fazer?', btn('abafa', '🔥 Abafa: todo mundo ao ataque') + btn('segura', '🧱 Segurar o resultado')],
  }[mo.t];

}
function scoreGoal(m, side, pid) {
  if (side === 0) m.gh++; else m.ga++;
  const p = P(pid);
  if (p) { p.g++; p.cg = (p.cg || 0) + 1; }

}
function resolveMoment(L, c) {
  const m = L.um, i = m.user, mo = L.moment, sh = P(mo.sh);
  const dive = () => weighted(['e', 'd', 'm'], x => x === 'm' ? .12 : .44);
  let note;
  if (mo.t === 'pen') {
    const k = dive(), goal = c === k ? rnd() < .1 : rnd() < (c === 'm' ? .97 : .85) + (sh.tr === 'cob' ? .05 : 0);
    if (goal) { scoreGoal(m, i, sh.id); note = `GOOOL! ${sh.n} converte o pênalti.`; } else { addEv(m, 'miss', i, sh.id); note = c === k ? 'O goleiro adivinhou o canto e defendeu!' : 'Bola para fora!'; }
  } else if (mo.t === 'penD') {
    const k = weighted(['e', 'd', 'm'], x => x === 'm' ? .16 : .42), saved = c === k ? rnd() < .85 : rnd() < .1;
    if (saved) { addEv(m, 'miss', 1 - i, sh.id); note = c === k ? 'DEFENDEU! Seu goleiro pulou no canto certo.' : 'Ele chutou para fora!'; }
    else { scoreGoal(m, 1 - i, sh.id); note = `Gol do adversário: ${sh.n} bateu ${k === 'm' ? 'no meio' : 'no outro canto'}.`; }
  } else if (mo.t === 'fk') {
    const pr = c === 'chute' ? clamp(.08 + (sh.r - 60) / 150 + (sh.tr === 'cob' ? .06 : 0), .06, .38) : .16;
    if (rnd() < pr) {
      const s = m.s[i], scorer = c === 'chute' ? sh : P(weighted(s.on.filter(id => P(id).p !== 'G'), id => ({A:5, M:2, L:1, Z:2})[P(id).p]));
      scoreGoal(m, i, scorer.id); note = c === 'chute' ? `Golaço de falta de ${sh.n}!` : `Gol de cabeça de ${scorer.n} após o cruzamento!`;
    } else { addEv(m, 'miss', i, sh.id); note = c === 'chute' ? 'A bola passou raspando a trave.' : 'A zaga afastou o cruzamento.'; }
  } else {
    const [pa, pb] = c === 'abafa' ? [.35, .2] : [.08, .05];
    const att = m.s[i].on.filter(id => P(id).p !== 'G'), opp = m.s[1 - i].on.filter(id => P(id).p !== 'G');
    const notes = [];
    if (rnd() < pa && att.length) { const p = P(pick(att)); scoreGoal(m, i, p.id); notes.push(`Gol de ${p.n} no sufoco!`); }
    if (rnd() < pb && opp.length) { const p = P(pick(opp)); scoreGoal(m, 1 - i, p.id); notes.push(`O adversário marcou ${c === 'abafa' ? 'no contra-ataque' : ''}.`); }
    note = notes.join(' ') || (c === 'abafa' ? 'Muita pressão, mas a bola não entrou.' : 'O time segurou o resultado.');
  }

}

// Gráfico de linha simples (SVG): pontos em sequência, com o primeiro e o último valor marcados
function lineChart(vals, {invert = false, fmt = v => v, label = ''} = {}) {

  const x = i => pad + i * (W - 2 * pad) / (vals.length - 1);
  const y = v => invert ? pad + (v - lo) / span * (H - 2 * pad) : H - pad - (v - lo) / span * (H - 2 * pad);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = vals.length - 1;
  return `<figure class="chart"><figcaption>${esc(label)}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: de ${fmt(vals[0])} para ${fmt(vals[last])}">
    <line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" class="ax"/><polyline points="${pts}" class="ln"/>
    <circle cx="${x(last)}" cy="${y(vals[last])}" r="3.5" class="pt"/>
    <text x="${pad}" y="${y(vals[0]) - 6}" class="tx">${esc(String(fmt(vals[0])))}</text>
    <text x="${x(last)}" y="${y(vals[last]) - 7}" class="tx" text-anchor="end">${esc(String(fmt(vals[last])))}</text></svg></figure>`;
}

const WC_NAME = 'Mundial de Seleções';
function natRank(p) {

}
// Fim da temporada: convocação (Modo Carreira) e, a cada 4 anos, o Mundial de Seleções
function nationalSeasonEnd(lines) {
  const p = isCareer() ? me_p() : null;
  let called = false;
  if (p && p.club) {
    const rk = natRank(p);
    if (rk <= 23) {
      called = true;
      const ap = ri(4, 9), g = Math.round(ap * ({A:.45, M:.18, L:.05, Z:.05, G:0}[p.p]) * rnd() * 2);
      S.man.nat = {ap: (S.man.nat?.ap || 0) + ap, g: (S.man.nat?.g || 0) + g};
      S.man.rep = clamp(S.man.rep + 2, 0, 100);
      lines.push(`🎽 Convocado para a seleção (${p.nat}): ${ap} jogos e ${g} gols no ano. Na seleção: ${S.man.nat.ap} jogos, ${S.man.nat.g} gols.`);
      unlock('nat');
    }
  }
  if (S.year % 4 !== 2) return;
  const by = {};
  for (const x of Object.values(S.players)) if (x.club && x.nat) (by[x.nat] ??= []).push(x.r);
  const teams = Object.entries(by).filter(([, rs]) => rs.length >= 11)
    .map(([n, rs]) => [n, rs.sort((a, b) => b - a).slice(0, 11).reduce((a, b) => a + b, 0) / 11]).sort((a, b) => b[1] - a[1]).slice(0, 16);
  if (teams.length < 16) return;
  let round = [0, 15, 7, 8, 3, 12, 4, 11, 1, 14, 6, 9, 2, 13, 5, 10].map(i => teams[i]);
  const lost = ['nas oitavas', 'nas quartas', 'na semifinal', 'na final'], reached = ['às quartas', 'à semifinal', 'à final', ''], mine = called ? p.nat : null;
  let path = '';
  for (let r = 0; round.length > 1; r++) {
    const next = [];
    for (let k = 0; k < round.length; k += 2) {
      const [a, b] = [round[k], round[k + 1]], w = rnd() < 1 / (1 + Math.exp(-(a[1] - b[1]) / 2.5)) ? a : b;
      next.push(w);
      if (mine && (a[0] === mine || b[0] === mine)) path = w[0] === mine ? `chegou ${reached[r]}` : `foi eliminada ${lost[r]} (${w[0]})`;
    }
    round = next;
  }
  const champ = round[0][0];
  (S.wc ??= []).unshift({y: S.year, champ});
  news(`${champ} é campeão do ${WC_NAME} ${S.year}!`);
  lines.push(`🌍 ${WC_NAME} ${S.year}: campeão ${champ}.`);
  if (mine) {
    if (champ === mine) { S.man.titles.push(`${WC_NAME} (${mine}) ${S.year}`); S.man.rep = clamp(S.man.rep + 10, 0, 100); unlock('wc'); lines.push(`🏆 Você é campeão do mundo com a seleção!`); }
    else lines.push(`🎽 No ${WC_NAME}, sua seleção ${path || 'ficou fora do mata-mata'}.`);
  }
}

function bigMatch(n) {

  if (n.kind === 'C') return S.cups.nat[myClub().lg].alive.length <= 4; // copa nacional: só semifinal e final

function simUntil(target) {

      if (target === 'big' && bigMatch(nextMatch())) { why = weeks ? 'big' : 'bignow'; break; }

      }

// ===================== Clubes que crescem e quebram =====================
// Fim da temporada, só clubes da IA: dívida alta vira crise (vende craques, perde reputação e até pontos);
// caixa saudável atrai investidores (estádio maior, mais dinheiro para contratar)
function clubFortunes(lines) {
  const me = coachClub(), owned = new Set((S.man.owned || []).map(o => o.id));
  const rich = Object.values(S.clubs).filter(c => c.cash > 2e7).sort((a, b) => b.cash - a.cash);
  for (const c of Object.values(S.clubs)) {
    if (c.id === me || owned.has(c.id) || c.lg === 'SA') continue;
    const val = Math.max(squadValue(c), 1e6);
    // Má gestão: de vez em quando um clube grande descobre um rombo nas contas
    if (c.rep >= 50 && rnd() < .02) {
      const debt = niceRound(val * (.8 + rnd() * .6) + Math.max(0, c.cash));
      c.cash -= debt;
      news(`📉 Rombo nas contas do ${c.name}: dívida de ${money(debt)} vem à tona.`);
    }
    if (c.cash < -Math.max(5e6, .3 * val)) {
      // Crise: vende os 2 mais valiosos para clubes com dinheiro
      const sold = [];
      for (const p of c.pl.map(P).filter(p => p.id !== S.man.pid).sort((a, b) => b.v - a.v).slice(0, 2)) {
        const b = rich.find(x => x.id !== c.id && x.id !== me && x.cash > p.v && x.pl.length < 32);
        if (!b) continue;
        b.cash -= p.v; c.cash += p.v; movePlayer(p, b.id); p.sal = salaryFor(p.v); p.ct = ri(2, 4); sold.push(`${p.n} (${b.name})`);
        recordTransfer(p, c.id, b.id, p.v);
      }
      c.rep = clamp(c.rep - 6, 5, 100);
      const severe = c.cash < -.6 * val;
      if (severe) c.penalty = 6; // começa a próxima liga com 6 pontos a menos
      news(`💸 Crise no ${c.name}: ${sold.length ? `vendeu ${sold.join(' e ')}` : 'sem compradores para os craques'}${severe ? ' e foi punido com a perda de 6 pontos' : ''}.`);
      if (c.lg === myClub()?.lg) lines.push(`💸 Crise financeira no ${c.name}${severe ? ': punido com -6 pontos na próxima liga' : ''}.`);
    } else if (c.cash > .4 * val && rnd() < .25) {
      c.seats = Math.min(95000, Math.round(c.seats * 1.12 / 500) * 500); c.rep = clamp(c.rep + 2, 0, 100);
      news(`🏗️ ${c.name} amplia o estádio para ${c.seats.toLocaleString('pt-BR')} lugares.`);
    }
    if (rnd() < .015 && c.rep < 80) {
      const inv = niceRound(val * .8 + 2e7);
      c.cash += inv; c.rep = clamp(c.rep + 6, 0, 100);
      news(`🤑 Novo dono bilionário compra o ${c.name} e promete ${money(inv)} em reforços.`);
      if (c.lg === myClub()?.lg) lines.push(`🤑 O ${c.name} tem um novo dono bilionário: prepare-se para um rival mais forte.`);
    }
  }
}

// ===================== Notas dos jogadores (0 a 10) =====================
const avgRt = p => p?.rn ? p.rs / p.rn : 0;
const fmtRt = n => n ? n.toFixed(1).replace('.', ',') : '–';
const rtClass = n => n >= 7.5 ? 'rt-hi' : n >= 6.5 ? 'rt-ok' : n ? 'rt-lo' : '';
function rateMatch(m) {
  m.rt = {};
  const reds = new Set(m.susp.map(x => x[0]));
  let best = null;
  for (let i = 0; i < 2; i++) {
    const s = m.s[i], gf = i ? m.ga : m.gh, ga = i ? m.gh : m.ga, ids = [...s.played].filter(P);
    const avg = ids.reduce((t, id) => t + P(id).r, 0) / Math.max(1, ids.length);
    const goals = {};
    for (const e of m.ev) if (e.t === 'goal' && e.i === i) goals[e.id] = (goals[e.id] || 0) + 1;
    for (const id of ids) {
      const p = P(id);
      let n = 6.1 + (gf > ga ? .5 : gf < ga ? -.5 : 0) + (goals[id] || 0) * (p.p === 'A' ? .9 : 1.1) + (p.r - avg) / 12 + (rnd() - .5) * 1.2;
      if ('GZL'.includes(p.p)) n += ga === 0 ? .6 : -.25 * Math.min(ga, 4);
      if (s.yel.has(id)) n -= .3;
      if (reds.has(id)) n -= 1.5;
      n = clamp(Math.round(n * 10) / 10, 3, 10);
      m.rt[id] = n; p.rs = (p.rs || 0) + n; p.rn = (p.rn || 0) + 1;
      if (!best || n > m.rt[best]) best = id;
    }
  }
  m.motm = best;
}
// Melhor seleção (4-4-2) a partir de uma lista {p, n}
function bestXI(list) {
  const used = new Set(), xi = [];
  for (const [need, ok] of [[1, 'G'], [4, 'LZ'], [4, 'M'], [2, 'A']]) {
    list.filter(x => ok.includes(x.p.p) && !used.has(x.p.id)).sort((a, b) => b.n - a.n).slice(0, need).forEach(x => { used.add(x.p.id); xi.push(x); });
  }
  return xi.map(x => ({pid: x.p.id, nm: x.p.n, pos: x.p.p, club: C(x.p.club)?.name || '', cid: x.p.club, n: Math.round(x.n * 10) / 10}));
}
function xiView(xi, title) {
  if (!xi?.length) return '';
  const row = ps => `<div class="xi-row">${xi.filter(x => ps.includes(x.pos)).map(x => `<div class="xi-p ${x.pid === S.man.pid || x.cid === coachClub() ? 'me' : ''}">
    <b class="${rtClass(x.n)}">${fmtRt(x.n)}</b><span>${esc(x.nm)}</span><small>${esc(x.club)}</small></div>`).join('')}</div>`;
  return `<div class="xi"><h3>${esc(title)}</h3>${row('A')}${row('M')}${row('LZ')}${row('G')}</div>`;
}
// Seleção da rodada: melhores notas dos jogos da divisão
function roundXI(matches) {
  const list = [];
  for (const m of matches) for (const [id, n] of Object.entries(m.rt || {})) { const p = P(+id); if (p) list.push({p, n}); }
  return bestXI(list);
}
// Time do Ano de cada 1ª divisão e do mundo (fim da temporada; quem jogou pelo menos 40% dos jogos)
function teamOfYear(year) {
  year.xi = {lg: {}, world: []};
  const all = [];
  for (const lg of Object.keys(LEAGUES)) {
    const d = S.divs[divKey(lg, 1)], games = Math.max(1, ...d.clubs.map(id => d.tbl[id]?.j || 0));
    const lgRep = d.clubs.reduce((s, id) => s + C(id).rep, 0) / d.clubs.length;
    const list = d.clubs.flatMap(id => C(id).pl.map(P)).filter(p => p && p.rn >= games * .4).map(p => ({p, n: avgRt(p)}));
    year.xi.lg[lg] = bestXI(list);
    all.push(...list.map(x => ({p: x.p, n: x.n + (lgRep - 60) / 90}))); // leve vantagem para ligas mais fortes
  }
  year.xi.world = bestXI(all).map(x => ({...x, n: Math.round(avgRt(P(x.pid)) * 10) / 10}));
}

const INSTR = {

  press: ['Pressão alta', 'Mais meio-campo, mas cansa mais. Forte contra o toque de bola.'],
  possess: ['Toque de bola', 'Domina o meio. Forte contra quem joga no contra-ataque.'],

function instrMods(mine, opp) {
  let a = 1, d = 1, mi = 1;
  if (mine === 'press') { mi *= 1.06; if (opp === 'possess') mi *= 1.04; }
  if (mine === 'possess') { mi *= 1.05; a *= .98; if (opp === 'counter') a *= 1.05; if (opp === 'press') mi *= .95; }
  if (mine === 'counter') { d *= 1.04; mi *= .97; if (opp === 'press') a *= 1.1; }
  if (mine === 'long') { a *= 1.04; mi *= .95; if (opp === 'possess') a *= 1.05; }
  return [a, d, mi];
}
// A IA escolhe conforme a força: favoritos pressionam ou tocam a bola; os mais fracos saem no contra-ataque ou na bola longa
function aiInstr(c) {
  const lgAvg = S.divs[divKey(c.lg, c.tier)]?.clubs.reduce((s, id, _, a) => s + clubAvg(C(id)) / a.length, 0) || clubAvg(c);
  const strong = clubAvg(c) >= lgAvg;
  return (strong ? ['press', 'possess'] : ['counter', 'long'])[(c.id + S.year) % 2];
}

// ===================== Árbitro de vídeo (jogo ao vivo) =====================
function maybeVar(L) {
  const m = L.um, goals = m.ev.filter(e => e.t === 'goal');
  const n = goals.length, prev = L.goalsSeen ?? 0;
  L.goalsSeen = n;
  if (n <= prev || L.moment || (L.vars || 0) >= 2 || rnd() > .07) return false;
  L.moment = {t: 'var', ev: goals[n - 1]};
  L.vars = (L.vars || 0) + 1; L.paused = true;
  return true;
}
function resolveVar(L) {
  const m = L.um, e = L.moment.ev, p = P(e.id);
  if (rnd() < .35) {
    if (e.i === 0) m.gh--; else m.ga--;
    if (p) { p.g--; p.cg = Math.max(0, (p.cg || 1) - 1); }
    e.t = 'var'; L.goalsSeen--;
    L.note = `📺 Gol anulado! O VAR viu ${pick(['impedimento', 'falta no início da jogada', 'toque de mão'])}.`;
  } else L.note = '📺 Gol confirmado pelo VAR!';
  L.moment = null; L.paused = false;
}

const cloudOk = () => !!window.google?.script?.run;
const cloudCall = (fn, ...a) => new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...a));
async function packSave(json) { // gzip + base64: o arquivo na nuvem fica ~10x menor
  const gz = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
  let bin = ''; const b = new Uint8Array(gz); for (let i = 0; i < b.length; i += 32768) bin += String.fromCharCode(...b.subarray(i, i + 32768));
  return btoa(bin);
}
async function unpackSave(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
