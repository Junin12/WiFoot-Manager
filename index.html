// ===================== Mercado =====================
function askPrice(p) {
  const club = C(p.club);
  const top3 = club.pl.map(P).sort((a, b) => b.r - a.r).slice(0, 3).includes(p);
  return niceRound(p.v * (top3 ? 1.35 : 1.1) * (p.ct <= 1 ? .7 : 1));
}
function salaryDemand(p, club) {
  const curRep = p.club ? C(p.club).rep : 30;
  const base = salaryFor(p.v) * clamp(1 + (curRep - club.rep) / 150, .85, 1.6) * (p.club ? 1 : 1.1);
  return Math.max(Math.round(p.sal * 1.1 / 100) * 100, Math.round(base / 100) * 100);
}
function tryBuy(p, fee, sal, yrs, deal) { // deal: preço já combinado (oferta relâmpago)
  const me = myClub();
  if (!p.club) fee = 0;
  else if (!isWindow(S.slot)) return 'A janela de transferências está fechada. Só é possível contratar jogadores livres.';
  if (me.pl.length >= 35) return 'Seu elenco está cheio (máximo de 35 jogadores).';
  if (fee > me.cash) return 'Você não tem dinheiro suficiente em caixa.';
  if (p.club) {
    const sel = C(p.club);
    if (sel.pl.length <= 17) return `O ${sel.name} não quer vender: o elenco está curto.`;
    const ask = askPrice(p);
    if (fee < ask && !deal) return `O ${sel.name} recusou. Eles pedem pelo menos ${money(ask)}.`;
  }
  if (p.r > clubAvg(me) + 12 && me.rep < 70) return `${p.n} não tem interesse em jogar no ${me.name}.`;
  const dem = salaryDemand(p, me);
  if (sal < dem) return `${p.n} quer ganhar pelo menos ${money(dem)} por semana.`;
  if (p.club) C(p.club).cash += fee;
  me.cash -= fee; S.fin.tout += fee;
  recordTransfer(p, p.club, me.id, fee);
  const from = p.club ? C(p.club).name : 'livre';
  movePlayer(p, me.id);
  p.sal = sal; p.ct = yrs;
  headline('transfer', {to: me.name, p: p.n, from, fee: money(fee)});
  return null;
}

// O jogo salvo passa de 4 MB com o banco completo: fica no IndexedDB (o localStorage guarda só o resumo da tela inicial)
function idb(mode, fn) {
  return new Promise((ok, fail) => {
    const r = indexedDB.open('wifoot', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('save');
    r.onerror = () => fail(r.error);
    r.onsuccess = () => { const tx = r.result.transaction('save', mode), q = fn(tx.objectStore('save')); tx.oncomplete = () => ok(q?.result); tx.onerror = () => fail(tx.error); };
  });
}
function save() {
  const n = UI.slot ||= 1, json = JSON.stringify(S);
  const meta = {name: S.man?.name, year: S.year, mode: S.mode, club: S.man?.club ? myClub()?.name : ''};
  idb('readwrite', st => st.put(json, slotKey(n))).catch(() => notify('Não foi possível salvar no navegador. Use "Exportar arquivo de jogo".'));
  try { localStorage.setItem(slotKey(n) + '-meta', JSON.stringify(meta)); } catch {}
  (UI.has ??= {})[n] = true;
  return true;
}function loadState(obj) {
  if (!obj || !obj.clubs || !obj.players || !obj.man) throw new Error('Arquivo de jogo inválido.');
  if (obj.v !== 4) throw new Error('Este jogo salvo é de uma versão anterior do banco de dados. Comece um novo jogo.');
  S = obj;
  for (const p of Object.values(S.players)) if (p.tr === undefined) p.tr = rollTrait(p.p); // jogos antigos ganham características
  UI.screen = 'game'; UI.tab = isCareer() ? 'career' : 'club'; UI.freeList = null; UI.summary = null;
}

function hashStr(s) { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
const CREST_SKIP = /^(de|da|do|dos|das|del|de la|la|las|los|el|the|of|y|e|and|fc|cf|sc|ac|afc|cd|ud|sd|ca|cr|se|ec|us|as|ss|sv|fk|sk|nk|vfl|tsv|club|clube|futebol|football|fútbol|esporte|sport|sporting|atlético|atletico|athletic|associação|deportivo|real|união|unión|racing|olympique|stade)$/i;
// Escudo gerado a partir do nome: duas cores e as iniciais (sem usar marcas reais)
function crest(id, cls = '') {
  const c = C(id);
  if (!c) return '';
  const h = hashStr(c.name), a = h % 360, b = (a + 140 + (h >> 9) % 80) % 360;
  const words = c.name.replace(/[^\p{L}\s-]/gu, ' ').split(/[\s-]+/).filter(Boolean);
  const main = words.filter(w => !CREST_SKIP.test(w));
  const pick = main.length ? main : words;
  const ini = (pick.length > 1 ? pick[0][0] + pick[1][0] : pick[0].slice(0, 2)).toUpperCase();
  // Cores do clube (as duas cores reais) ou, sem elas, um par derivado do nome
  const [c1, c2] = /^#[0-9a-f]{6}$/i.test(c.colors?.[0]) && /^#[0-9a-f]{6}$/i.test(c.colors?.[1]) ? c.colors : [`hsl(${a} 62% 34%)`, `hsl(${b} 60% 46%)`];
  return `<span class="crest ${cls}" style="--c1:${c1};--c2:${c2}" aria-hidden="true">${esc(ini)}</span>`;
}
const COMP_STYLE = {L:'liga', C:'copa', E:'eu', LIB:'lib', SUL:'sul', SMW:'mundial', INT:'mundial'};
const compChip = (kind, text) => `<span class="chip chip-${COMP_STYLE[kind] || 'liga'}">${esc(text)}</span>`;
// Competição, fase e tipo de uma partida
function matchMeta(m) {

  if (m.tour) return {kind: m.tour, comp: S.tours[m.tour].name, stage: stageLabel(m.stage)};
  const cup = getCup(m.cup);
  return {kind: m.cup === 'EU' ? 'E' : 'C', comp: cup.name, stage: m.rname || cup.rname || ''};
}
// Próximo compromisso do clube do jogador
function nextMatch() {
  const me = S.man.club, club = myClub();
  for (let s = S.slot; s < S.cal.length; s++) {
    const ev = S.cal[s];
    if (ev.t === 'L') {

      const g = d.fx[j].find(x => x.includes(me));
      if (g) return {s, kind: 'L', comp: divName(d), stage: `Rodada ${j + 1}`, h: g[0], a: g[1]};
    } else if (ev.t === 'C' || ev.t === 'E') {

      if (t) return {s, kind: t.id, comp: t.name, stage: stageLabel(t.plan[t.step]), h: me, a: null};

}
function nextFixture() {

// ===================== Modo Carreira: dinheiro do jogador =====================
// Retorno anual médio e volatilidade de cada aplicação (sorteado no fim de cada temporada)
const INVEST = [
  {k:'POUP', n:'Poupança', m:.04, sd:.005, risk:'Muito baixo'},
  {k:'RF', n:'Renda fixa', m:.07, sd:.02, risk:'Baixo'},
  {k:'IMO', n:'Fundos imobiliários', m:.06, sd:.08, risk:'Médio'},
  {k:'ACO', n:'Ações', m:.09, sd:.22, risk:'Alto'},
  {k:'CRI', n:'Criptomoedas', m:.12, sd:.6, risk:'Muito alto'},
];
// Treino particular: até 2 por temporada e 8 na carreira, nunca acima de força 92
const TRAIN_MAX_SEASON = 2, TRAIN_MAX_CAREER = 8, TRAIN_CAP = 92;
function careerInit() {
  const m = S.man;
  m.inv ??= {}; m.owned ??= []; m.trainTotal ??= 0; m.props ??= []; m.academy ??= 0; m.money ??= 0;
  if (!m.train || m.train.year !== S.year) m.train = {year: S.year, n: 0};
}
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
// Preço de um clube: elenco + estádio + força da marca
const clubPrice = c => niceRound(squadValue(c) * 1.1 + c.seats * 1500 + c.rep * c.rep * 20000);
const invTotal = () => Object.values(S.man.inv || {}).reduce((a, b) => a + b, 0);
const ownedTotal = () => (S.man.owned || []).reduce((s, o) => s + (C(o.id) ? clubPrice(C(o.id)) : 0), 0);
const netWorth = () => S.man.money + invTotal() + ownedTotal() + propsTotal() + academyValue();
const trainCost = p => Math.round(Math.max(20000, p.sal * 8) * (S.man.train.n ? 2.5 : 1) / 1000) * 1000;
const trainLeft = () => Math.min(TRAIN_MAX_SEASON - S.man.train.n, TRAIN_MAX_CAREER - S.man.trainTotal - S.man.train.n);
// Fim de temporada: rendimento das aplicações e dividendos dos clubes comprados
// Imóveis: aluguel pago toda semana (y = rendimento por temporada) e valorização ou queda no fim da temporada
const PROPS = [
  {k:'APT', n:'Apartamento', ic:'🏢', p:4e5, y:.06},
  {k:'CASA', n:'Casa de praia', ic:'🏖️', p:1.2e6, y:.055},
  {k:'LOJA', n:'Loja comercial', ic:'🏬', p:3e6, y:.07},
  {k:'PRED', n:'Prédio de escritórios', ic:'🏙️', p:12e6, y:.075},
  {k:'HOTEL', n:'Hotel', ic:'🏨', p:35e6, y:.08},
];
const PROP = Object.fromEntries(PROPS.map(x => [x.k, x]));
// Escolinha de futebol: revela jovens que são vendidos a clubes do país (kids = revelações por temporada)
const ACADEMY = [null,
  {n:'Escolinha de futebol', cost:1.5e6, keep:1.5e5, kids:1},
  {n:'Centro de formação', cost:5e6, keep:4e5, kids:2},
  {n:'CT de alto rendimento', cost:15e6, keep:1e6, kids:3}];
const propsTotal = () => (S.man.props || []).reduce((s, o) => s + o.v, 0);
const academyValue = () => ACADEMY.slice(1, (S.man.academy || 0) + 1).reduce((s, a) => s + a.cost * .5, 0);
const ownsClub = id => (S.man.owned || []).some(o => o.id === id);
const coachWage = rep => Math.round(1000 + rep * rep * 4); // salário semanal do treinador ex-jogador
function weeklyRent() { return (S.man.props || []).reduce((s, o) => s + o.v * PROP[o.k].y, 0) / S.cal.length; }
function academySeasonEnd(lines) {
  const lvl = S.man.academy || 0, a = ACADEMY[lvl];
  if (!a) return;
  S.man.money -= a.keep;
  const base = myClub() || Object.values(S.clubs)[0];
  const buyers = Object.values(S.clubs).filter(c => c.lg === base.lg);
  let total = 0;
  for (let i = 0; i < a.kids; i++) {
    const buyer = pick(buyers), joia = rnd() < .06 * lvl;
    const p = genPlayer(buyer.id, pick(['Z', 'L', 'M', 'M', 'A', 'A']), 46 + lvl * 3 + ri(0, 8) + (joia ? 6 : 0), ri(16, 17));
    p.pt = joia ? ri(88, 94) : ri(72, 80 + lvl * 4); p.ct = 3; p.v = valueOf(p); p.sal = salaryFor(p.v);
    const fee = Math.round(p.v * (1.2 + (p.pt - 70) / 20));
    buyer.cash -= fee; total += fee;
    S.man.rep = clamp(S.man.rep + 1, 0, 100);
    lines.push(`🌱 ${a.n}: ${p.n} (${POS_NAME[p.p]}, ${p.a} anos${joia ? ', uma joia' : ''}) vendido ao ${buyer.name} por ${money(fee)}.`);
    if (joia) news(`${p.n}, revelado no projeto "${a.n}" de ${S.man.name}, chega ao ${buyer.name} como grande promessa.`);
  }
  S.man.money += total;
  lines.push(`🏫 Manutenção (${a.n}): ${money(a.keep)}.`);
}
function propsSeasonEnd(lines) {
  if (!S.man.props?.length) return;
  const before = propsTotal();
  for (const o of S.man.props) o.v = Math.round(o.v * (1 + clamp(.03 + .06 * gauss(), -.25, .35)));
  const after = propsTotal();
  lines.push(`🏠 Imóveis: ${money(S.man.rent || 0)} de aluguel na temporada; valem ${money(after)} (${after >= before ? '+' : ''}${money(after - before)}).`);
  S.man.rent = 0;
}
function wealthSeasonEnd(lines) {
  careerInit();
  for (const f of INVEST) {
    const v = S.man.inv[f.k];
    if (!v) continue;
    const r = clamp(f.m + f.sd * gauss(), -.85, 2.5), nv = Math.round(v * (1 + r));
    S.man.inv[f.k] = nv;
    lines.push(`${r >= 0 ? '📈' : '📉'} ${f.n}: ${r >= 0 ? '+' : ''}${(r * 100).toFixed(1)}% (${nv >= v ? '+' : ''}${money(nv - v)}).`);
  }
  for (const o of S.man.owned) {
    const c = C(o.id);
    if (!c) continue;
    // tabela final da temporada (o acesso e o rebaixamento já mudaram a lista de clubes da divisão)
    const d = S.divs[divKey(c.lg, c.tier)], ids = Object.keys(d.tbl).map(Number), pos = standings({clubs: ids, tbl: d.tbl}).indexOf(c.id) + 1, v = clubPrice(c);
    const div = c.tier === 1 && pos <= ids.length / 2 ? Math.round(v * .02) : 0;
    S.man.money += div;
    lines.push(`🏟️ ${c.name} (seu clube) terminou em ${pos}º e vale ${money(v)}${div ? `; dividendos de ${money(div)}` : ''}.`);
  }
  propsSeasonEnd(lines);
  academySeasonEnd(lines);
}

function intlStatus(id) {
  const out = [], eu = S.cups.euro;
  if (eu.teams.includes(id)) out.push([NAMES.EU, eu.champ === id ? '🏆 Campeão' : eu.alive.includes(id) && !eu.champ ? 'Disputando' : 'Eliminado']);
  for (const t of Object.values(S.tours)) {
    if (!t.teams.includes(id)) continue;
    const st = t.champ === id ? '🏆 Campeão' : t.champ || !t.alive.includes(id) ? 'Eliminado' : stageLabel(t.plan[t.step]).replace(/ ·.*| \(.*\)/, '');
    out.push([t.name, st]);
  }
  return out;
}

function miniTable(div, highlight, limit) {
  const t = standings(div), N = t.length, k = promoCount(div.lg);
  const rows = t.map((id, i) => {

    return `<tr class="${z} ${id === highlight ? 'me' : ''}"><td class="n">${i + 1}</td><td>${crest(id, 'sm')} ${clubLink(id)}</td><td class="n f">${r.pts}</td><td class="n">${r.j}</td><td class="n">${r.v}</td><td class="n">${r.e}</td><td class="n">${r.d}</td><td class="n">${r.gp}</td><td class="n">${r.gc}</td><td class="n">${r.gp - r.gc}</td></tr>`;
  });
  return `<div class="tw"><table><thead><tr><th class="n">#</th><th>Clube</th><th class="n">P</th><th class="n">J</th><th class="n">V</th><th class="n">E</th><th class="n">D</th><th class="n">GP</th><th class="n">GC</th><th class="n">SG</th></tr></thead>

function groupTable(t, g, me) {

}

          <b>${money(m.inv[f.k] || 0)}</b>
          <div class="row"><input id="inv-${f.k}" type="number" min="0" step="10000" placeholder="Valor (€)" aria-label="Valor para ${f.n}">
          <button data-act="invBuy" data-k="${f.k}">Aplicar</button><button data-act="invSell" data-k="${f.k}" ${m.inv[f.k] ? '' : 'disabled'}>Resgatar</button></div></div>`).join('')}</div></section>
      <section class="card"><h2>🏠 Imóveis</h2><p class="muted">Pagam aluguel toda semana (${money(weeklyRent())}/semana hoje) e mudam de valor no fim da temporada, com menos risco que as ações. A venda sai por 97% do valor.</p>
        ${m.props.length ? `<div class="tw"><table><tbody>${m.props.map((o, i) => `<tr><td>${PROP[o.k].ic} ${PROP[o.k].n}</td><td class="n">${money(o.v)}</td>
          <td class="n ${o.v >= o.paid ? 'good' : 'bad'}">${o.v >= o.paid ? '+' : ''}${money(o.v - o.paid)}</td><td><button data-act="propSell" data-i="${i}">Vender</button></td></tr>`).join('')}</tbody></table></div>` : ''}
        <div class="inv">${PROPS.map(x => `<div class="inv-row"><div><strong>${x.ic} ${x.n}</strong><span class="muted">Aluguel ≈ ${Math.round(x.y * 100)}% do valor por temporada</span></div>
          <b>${money(x.p)}</b><div class="row"><button class="primary" data-act="propBuy" data-k="${x.k}" ${x.p <= m.money ? '' : 'disabled'}>Comprar</button></div></div>`).join('')}</div></section>
      <section class="card"><h2>🏫 Escolinha de futebol</h2>
        <p class="muted">Revela jovens que são vendidos a clubes do país no fim de cada temporada. Cada revelação aumenta a sua reputação; às vezes aparece uma joia, vendida bem mais caro.</p>
        <p>${lvl ? `Você tem: <strong>${ACADEMY[lvl].n}</strong> · ${ACADEMY[lvl].kids} revelação(ões) por temporada · manutenção de ${money(ACADEMY[lvl].keep)}/temporada` : 'Você ainda não tem uma escolinha.'}</p>
        ${next ? `<button class="primary" data-act="academyUp" ${next.cost <= m.money ? '' : 'disabled'}>${lvl ? 'Ampliar para' : 'Abrir'} ${next.n} · ${money(next.cost)}</button>
          <p class="muted">${next.kids} revelação(ões) por temporada; manutenção de ${money(next.keep)}.</p>` : '<p class="good">Estrutura máxima.</p>'}</section></div>
      <section class="card"><h2>🏟️ Comprar um clube</h2>
        <p class="muted">Preço = valor do elenco + estádio + força da marca. O valor muda a cada temporada com o desempenho; clubes na primeira metade da 1ª divisão pagam 2% de dividendos por ano. A venda sai por 95% do valor atual.
        Como presidente, você pode aportar dinheiro no clube: ele usa o caixa para contratar reforços. ${career ? 'Se for dono do clube em que joga, você não fica sem contrato.' : 'Ninguém demite o dono: no seu clube, o cargo de treinador é seu.'}</p>
        ${m.owned.length ? `<h3>Seus clubes</h3><div class="tw"><table><tbody>${m.owned.map(o => { const c = C(o.id); if (!c) return '';
          const v = clubPrice(c), pl = v - o.paid;
          return `<tr><td>${crest(c.id, 'sm')} ${esc(c.name)}<br><small class="muted">Caixa do clube: ${money(c.cash)}</small></td><td class="n">${money(v)}</td><td class="n ${pl >= 0 ? 'good' : 'bad'}">${pl >= 0 ? '+' : ''}${money(pl)}</td>
            <td><div class="row"><input id="inj-${c.id}" type="number" min="0" step="100000" placeholder="Aporte (€)" aria-label="Valor do aporte no ${esc(c.name)}" style="max-width:9rem">
            <button data-act="injectClub" data-id="${c.id}">Aportar</button><button data-act="sellClub" data-id="${c.id}">Vender</button></div></td></tr>`; }).join('')}</tbody></table></div>` : ''}
        <div class="row"><label>Liga<select data-chg="buyLg">${Object.values(LEAGUES).map(l => `<option value="${l.id}" ${l.id === lg ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label></div>
        <div class="tw" style="max-height:55vh;margin-top:.6rem"><table><thead><tr><th>Clube</th><th>Divisão</th><th class="n">Preço</th><th></th></tr></thead><tbody>
        ${clubs.map(c => { const pr = clubPrice(c); return `<tr><td>${crest(c.id, 'sm')} ${esc(c.name)}</td><td>${c.tier}ª</td><td class="n">${money(pr)}</td>
          <td><button class="primary" data-act="buyClub" data-id="${c.id}" ${pr <= m.money ? '' : 'disabled'}>Comprar</button></td></tr>`; }).join('')}
        </tbody></table></div></section>`;
  },
  squad() {
    const c = myClub();
    const ord = p => POS.indexOf(p.p) * 1000 - p.r;
    const rows = c.pl.map(P).sort((a, b) => ord(a) - ord(b)).map(p => {
      const st = c.xi.includes(p.id) ? 'T' : c.bench.includes(p.id) ? 'R' : '';
      return `<tr><td><button class="sel ${st}" data-act="toggle" data-id="${p.id}" aria-label="Situação de ${esc(p.n)}: ${st === 'T' ? 'titular' : st === 'R' ? 'reserva' : 'fora'}">${st || '–'}</button></td>
        <td>${posTag(p.p)}</td><td>${playerLink(p)}${traitTag(p)}</td><td class="n">${p.a}</td><td class="n f">${p.r}</td><td>${enBar(p.en)}</td><td>${statusOf(p)}</td>
        <td class="n">${p.ap}</td><td class="n">${p.g}</td><td class="n ${rtClass(avgRt(p))}">${fmtRt(avgRt(p))}</td><td class="n">${money(p.sal)}</td><td class="n">${p.ct}a</td><td class="n">${money(p.v)}</td></tr>`;
    }).join('');

    return `<section class="card"><div class="row">
      <label>Formação<select data-chg="form">${Object.keys(FORMS).map(f => `<option ${f === c.tac.f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
      <label>Estilo<select data-chg="style">${STYLES.map((s, i) => `<option value="${i}" ${i === c.tac.s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <label>Instrução<select data-chg="instr">${Object.entries(INSTR).map(([k, [n]]) => `<option value="${k}" ${k === (c.tac.i || 'none') ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <button data-act="autoPick">Escalar automaticamente</button>
      <span class="muted">Titulares ${c.xi.length}/11 · Reservas ${c.bench.length}/7 · Elenco ${c.pl.length}/35 · Moral: ${moraleText(c.mor)}</span></div>
      <p class="muted">${esc(INSTR[c.tac.i || 'none'][1])} Na tabela, o botão da primeira coluna alterna: <strong>T</strong> titular → <strong>R</strong> reserva → fora.</p></section>
      <div class="grid2" style="grid-template-columns:minmax(260px,380px) 1fr">${pitchView(c)}
      <section class="card tw"><table><thead><tr><th></th><th>Pos</th><th>Nome</th><th class="n">Id</th><th class="n">Força</th><th>Energia</th><th>Status</th><th class="n">J</th><th class="n">Gols</th><th class="n" title="Nota média na temporada">Nota</th><th class="n">Salário/sem</th><th class="n">Contr.</th><th class="n">Valor</th></tr></thead><tbody>${rows}</tbody></table></section></div>`;
  },

  tables() {
    const c = myClub();
    const lg = UI.tableLg || c.lg, tier = UI.tableLg ? UI.tableTier : c.tier;
    const cupId = UI.tableCup;
    let body;
    if (S.tours[cupId]) body = tourView(S.tours[cupId], c.id);
    else if (cupId) {
      const cup = getCup(cupId);
      body = `<h2>${esc(cup.name)}</h2>${cup.champ ? `<p class="good">🏆 Campeão: ${esc(C(cup.champ).name)}</p>` : `<p class="muted">${cup.alive.length} clubes vivos.</p>`}
        ${koLog(cup.log, c.id)}`;
    } else {
      const d = S.divs[divKey(lg, tier)];
      body = `<h2>${esc(divName(d))}</h2>${miniTable(d, c.id)}
        <p class="muted">${tier === 1 ? `${LEAGUES[lg].conf === 'OUTRA' ? '' : `Verde: ${CONMEBOL.has(lg) ? NAMES.LIB : NAMES.EU} · `}${promoCount(lg) ? `Vermelho: rebaixamento (${promoCount(lg)})` : 'Sem rebaixamento'}` : `Azul: acesso (${promoCount(lg)})`}</p>`;
    }
    return `<section class="card"><div class="row">
      <label>Liga<select data-chg="tableLg">${Object.values(LEAGUES).map(l => `<option value="${l.id}" ${l.id === lg && !cupId ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label>
      <label>Divisão<select data-chg="tableTier"><option value="1" ${tier === 1 ? 'selected' : ''}>1ª divisão</option>${S.divs[divKey(lg, 2)].clubs.length ? `<option value="2" ${tier === 2 ? 'selected' : ''}>Acesso</option>` : ''}</select></label>
      <label>Copas<select data-chg="tableCup"><option value="">—</option>
        ${Object.values(S.tours).map(t => `<option value="${t.id}" ${cupId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
        <option value="EU" ${cupId === 'EU' ? 'selected' : ''}>${esc(NAMES.EU)}</option>
        ${Object.keys(LEAGUES).map(id => `<option value="${id}" ${cupId === id ? 'selected' : ''}>${esc(S.cups.nat[id].name)}</option>`).join('')}</select></label></div></section>
      <section class="card">${body}</section>`;
  },

  fixtures() {
    const c = myClub(), d = S.divs[divKey(c.lg, c.tier)];
    const rows = [];
    for (let s = 0; s < S.cal.length; s++) {
      const ev = S.cal[s];
      if (ev.t !== 'L') continue;
      const j = d.roundAt[ev.i];
      if (j == null) continue;
      const g = d.fx[j].find(x => x.includes(c.id));
      if (!g) { rows.push(`<tr><td>${s + 1}</td><td>Rodada ${j + 1}</td><td colspan="3" class="muted">Folga</td></tr>`); continue; }
      const res = (d.res[j] || []).find(r => r[0] === g[0] && r[1] === g[1]);
      let cls = '';
      if (res) { const my = g[0] === c.id ? res[2] - res[3] : res[3] - res[2]; cls = my > 0 ? 'good' : my < 0 ? 'bad' : 'warn'; }
      rows.push(`<tr class="${s === S.slot ? 'me' : ''}"><td>${s + 1}</td><td>Rodada ${j + 1}</td><td>${g[0] === c.id ? 'Casa' : 'Fora'}</td><td>${clubLink(g[0] === c.id ? g[1] : g[0])}</td>
        <td class="f ${cls}">${res ? `${res[2]} x ${res[3]}` : '—'}</td></tr>`);
    }
    const cupRows = [S.cups.nat[c.lg], S.cups.euro].flatMap(cup => cup.log.flatMap(r => r.games.filter(g => g[0] === c.id || g[1] === c.id)
      .map(([h, a, gh, ga, pen]) => `<tr><td>${esc(cup.name)}</td><td>${esc(r.name)}</td><td>${esc(C(h).name)} ${gh} x ${ga} ${esc(C(a).name)}${pen ? ` (pên. ${pen[0]}-${pen[1]})` : ''}</td></tr>`)));
    for (const t of Object.values(S.tours)) {
      for (const [h, a, gh, ga] of t.glog) if (h === c.id || a === c.id) cupRows.push(`<tr><td>${esc(t.name)}</td><td>Fase de grupos</td><td>${esc(C(h).name)} ${gh} x ${ga} ${esc(C(a).name)}</td></tr>`);
      for (const r of t.log) for (const [h, a, gh, ga, pen, agg] of r.games) if (h === c.id || a === c.id)
        cupRows.push(`<tr><td>${esc(t.name)}</td><td>${esc(r.name)}</td><td>${esc(C(h).name)} ${gh} x ${ga} ${esc(C(a).name)}${agg ? ` (agregado ${agg[0]}-${agg[1]})` : ''}${pen ? ` (pên. ${pen[0]}-${pen[1]})` : ''}</td></tr>`);
    }
    return `<section class="card"><h2>Liga — ${esc(divName(d))}</h2><div class="tw"><table><thead><tr><th>Sem.</th><th>Rodada</th><th>Mando</th><th>Adversário</th><th>Resultado</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>
      <section class="card"><h2>Copas</h2>${cupRows.length ? `<div class="tw"><table><tbody>${cupRows.join('')}</tbody></table></div>` : '<p class="muted">Nenhum jogo de copa ainda.</p>'}</section>`;
  },

  scorers() {
    const c = myClub(), lg = UI.scoreLg || c.lg, tier = UI.scoreLg ? UI.scoreTier : c.tier;
    const ids = new Set(S.divs[divKey(lg, tier)].clubs);
    const top = Object.values(S.players).filter(p => p.g > 0 && ids.has(p.club)).sort((a, b) => b.g - a.g || a.ap - b.ap).slice(0, 25);
    return `<section class="card"><div class="row">
      <label>Liga<select data-chg="scoreLg">${Object.values(LEAGUES).map(l => `<option value="${l.id}" ${l.id === lg ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label>
      <label>Divisão<select data-chg="scoreTier"><option value="1" ${tier === 1 ? 'selected' : ''}>1ª divisão</option><option value="2" ${tier === 2 ? 'selected' : ''}>Acesso</option></select></label></div>
      <p class="muted">Gols em todas as competições da temporada.</p>
      <div class="tw"><table><thead><tr><th class="n">#</th><th>Jogador</th><th>Pos</th><th>Clube</th><th class="n">Jogos</th><th class="n">Gols</th></tr></thead><tbody>
      ${top.map((p, i) => `<tr class="${p.club === c.id ? 'me' : ''}"><td class="n">${i + 1}</td><td>${playerLink(p)}</td><td>${posTag(p.p)}</td><td>${esc(C(p.club).name)}</td><td class="n">${p.ap}</td><td class="n f">${p.g}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nenhum gol ainda.</td></tr>'}
      </tbody></table></div></section>`;
  },

  market() {
    const f = UI.mkt, me = S.man.club, q = f.q.trim().toLowerCase();
    // dev-senior: busca linear em ~11 mil jogadores; rápido o suficiente no navegador
    const out = [];
    for (const p of Object.values(S.players)) {
      if (p.club === me) continue;
      if (f.pos && p.p !== f.pos) continue;
      if (f.lg === 'FREE') { if (p.club) continue; } else if (f.lg && (!p.club || C(p.club).lg !== f.lg)) continue;
      if (p.r < f.min || (f.max && p.v > f.max) || (f.age && p.a > f.age)) continue;
      if (q && !p.n.toLowerCase().includes(q)) continue;
      out.push(p);
    }
    out.sort((a, b) => b.r - a.r);
    return `${scoutCard()}<section class="card"><h2>Transferências</h2>
      <p class="${isWindow(S.slot) ? 'good' : 'warn'}">${isWindow(S.slot) ? 'Janela aberta: compre e venda à vontade.' : `Janela fechada (abre nas ${windowText()}). Jogadores livres podem ser contratados a qualquer momento.`}</p>
      <form class="row" data-form="mkt" onsubmit="return false">
        <label>Nome<input name="q" value="${esc(f.q)}" placeholder="Buscar..."></label>
        <label>Posição<select name="pos"><option value="">Todas</option>${POS.map(p => `<option value="${p}" ${f.pos === p ? 'selected' : ''}>${POS_NAME[p]}</option>`).join('')}</select></label>
        <label>Liga<select name="lg"><option value="">Todas</option><option value="FREE" ${f.lg === 'FREE' ? 'selected' : ''}>Jogadores livres</option>${Object.values(LEAGUES).map(l => `<option value="${l.id}" ${f.lg === l.id ? 'selected' : ''}>${esc(l.country)}</option>`).join('')}</select></label>
        <label>Força mínima<input name="min" type="number" min="0" max="99" value="${f.min || ''}"></label>
        <label>Valor máximo (€)<input name="max" type="number" min="0" step="100000" value="${f.max || ''}"></label>
        <label>Idade máxima<input name="age" type="number" min="15" max="45" value="${f.age || ''}"></label>
        <button class="primary" data-act="mktSearch">Buscar</button></form></section>
      <section class="card tw"><p class="muted">${out.length} jogadores encontrados${out.length > 100 ? ' (mostrando os 100 mais fortes)' : ''}.</p>
      <table><thead><tr><th>Pos</th><th>Nome</th><th class="n">Id</th><th class="n">Força</th><th>Clube</th><th>Nac.</th><th class="n">Valor</th><th class="n">Salário/sem</th></tr></thead><tbody>
      ${out.slice(0, 100).map(p => `<tr><td>${posTag(p.p)}</td><td>${playerLink(p)}</td><td class="n">${p.a}</td><td class="n f">${p.r}</td><td>${p.club ? esc(C(p.club).name) : '<span class="good">Livre</span>'}</td><td>${esc(p.nat)}</td><td class="n">${money(p.v)}</td><td class="n">${money(p.sal)}</td></tr>`).join('')}
      </tbody></table></section>`;
  },

  finance() {
    const c = myClub(), F = S.fin, wages = weeklyWages(c);
    const inc = F.ing + F.pat + F.prem + F.tin + (F.saf || 0), out = F.sal + F.tout + F.obra + F.jur;
    const loanMax = Math.max(0, 1e6 + c.rep * 2e5 - c.debt);
    return `<div class="grid2"><section class="card"><h2>Balanço da temporada</h2>
      <div class="tw"><table><tbody>
      <tr><td>Bilheteria</td><td class="n good">${money(F.ing)}</td></tr><tr><td>Patrocínio e TV</td><td class="n good">${money(F.pat)}</td></tr>
      <tr><td>Premiações</td><td class="n good">${money(F.prem)}</td></tr><tr><td>Venda de jogadores</td><td class="n good">${money(F.tin)}</td></tr>
      ${S.man.saf ? `<tr><td>Aporte da SAF</td><td class="n good">${money(F.saf || 0)}</td></tr>` : ''}
      <tr><td>Salários</td><td class="n bad">-${money(F.sal)}</td></tr><tr><td>Compra de jogadores</td><td class="n bad">-${money(F.tout)}</td></tr>
      <tr><td>Obras no estádio</td><td class="n bad">-${money(F.obra)}</td></tr><tr><td>Juros</td><td class="n bad">-${money(F.jur)}</td></tr>
      <tr><th>Resultado</th><th class="n ${inc - out >= 0 ? 'good' : 'bad'}">${money(inc - out)}</th></tr></tbody></table></div>
      <dl class="kv" style="margin-top:.6rem"><dt>Caixa</dt><dd class="f">${money(c.cash)}</dd><dt>Dívida no banco</dt><dd>${money(c.debt)}</dd>
      <dt>Folha semanal</dt><dd>${money(wages)}</dd></dl>
      <h2 style="margin-top:1rem">Patrocínio master</h2>
      ${S.sponsor ? `<p><strong>${esc(S.sponsor.n)}</strong>: ${money(S.sponsor.week)}/semana${S.sponsor.win ? ` + ${money(S.sponsor.win)} por vitória` : ''}${S.sponsor.goal ? ` + ${money(S.sponsor.goal)} se cumprir o objetivo` : ''}. Contrato até o fim da temporada.</p>`
      : `<p class="muted">Escolha uma proposta para esta temporada (se não escolher, a diretoria assina a primeira ao jogar a próxima rodada):</p>
        ${S.sponsorOffers.map((o, i) => `<div class="msg"><strong>${esc(o.n)}</strong> — ${money(o.week)}/semana${o.win ? ` + ${money(o.win)} por vitória` : ''}${o.goal ? ` + ${money(o.goal)} pelo objetivo` : ''}
          <br><span class="muted">${esc(o.desc)}</span> <button data-act="sponsor" data-i="${i}">Assinar</button></div>`).join('')}`}
      ${S.man.saf ? `<h2 style="margin-top:1rem">🏦 SAF — aporte da temporada</h2>${safBox(c)}` : ''}</section>
      <section class="card"><h2>Ingressos</h2>
        <p class="muted">Preço de referência para o seu clube: ${money(c.ref)}. Mais caro dá mais receita por torcedor, mas esvazia o estádio.</p>
        <form class="row" onsubmit="return false"><label>Preço do ingresso (€)<input id="price" type="number" min="1" max="300" value="${c.price}" required></label>
        <button data-act="setPrice">Salvar</button></form>
        <h2 style="margin-top:1rem">Estádio</h2><p>${esc(c.stadium)}: <strong>${c.seats.toLocaleString('pt-BR')}</strong> lugares.</p>
        <form class="row" onsubmit="return false"><label>Ampliar (lugares)<select id="expand">${[1000, 2000, 5000, 10000].map(n => `<option value="${n}">+${n.toLocaleString('pt-BR')} — ${money(n * 600)}</option>`).join('')}</select></label>
        <button data-act="expand" ${c.seats >= 100000 ? 'disabled' : ''}>Construir</button></form>
        <h2 style="margin-top:1rem">Banco</h2><p class="muted">Juros de 0,8% por semana sobre a dívida. Limite disponível: ${money(loanMax)}.</p>
        <form class="row" onsubmit="return false"><label>Valor (€)<input id="loan" type="number" min="0" step="100000" value="1000000"></label>
        <button data-act="borrow">Pegar empréstimo</button><button data-act="repay" ${c.debt ? '' : 'disabled'}>Pagar dívida</button></form></section></div>`;
  },

  inbox() {
    S.inbox.forEach(m => { m.readLater = !m.read; m.read = true; });
    return `<section class="card"><h2>Mensagens</h2>${S.inbox.length ? S.inbox.map(m => {
      let actions = '';
      if (m.type === 'offer' && !m.done) actions = `<div class="row" style="margin-top:.3rem"><button class="primary" data-act="offerAccept" data-id="${m.id}">Aceitar</button><button data-act="offerReject" data-id="${m.id}">Recusar</button></div>`;
      if (m.type === 'pOffer' && !m.done) actions = `<div class="row" style="margin-top:.3rem"><button class="primary" data-act="pOfferAccept" data-id="${m.id}">Aceitar proposta</button><button data-act="offerReject" data-id="${m.id}">Recusar</button></div>`;
      if (m.type === 'flash' && !m.done) actions = `<div class="row" style="margin-top:.3rem"><button class="primary" data-act="flashBuy" data-id="${m.id}">Comprar por ${money(m.price)}</button><button data-act="offerReject" data-id="${m.id}">Recusar</button></div>`;

// Modo Carreira: como o jogador foi na partida do seu time
function myPerf(m) {
  if (!isCareer()) return '';
  const pid = S.man.pid, side = m.s.find(s => s.played.has(pid));
  if (!side) return `<p class="notice">👟 Você não entrou em campo${P(pid).inj ? ' (lesionado)' : P(pid).sus ? ' (suspenso)' : ''}.</p>`;
  const g = m.ev.filter(e => e.t === 'goal' && e.id === pid).length, sub = m.ev.some(e => e.t === 'sub' && e.id === pid);
  return `<p class="notice">👟 Você jogou${sub ? ' (entrou no 2º tempo)' : ''}${g ? ` e marcou ${g === 1 ? 'um gol' : g + ' gols'}! ⚽` : '.'}</p>`;
}
function safBox(c) {
  const max = SAF_MULT * clubValue(c);
  if (S.safDone) return `<p>Aporte desta temporada: <strong>${money(S.fin.saf)}</strong>. O próximo pode ser feito no início da próxima temporada.</p>`;
  if (S.slot > 0) return '<p class="muted">O aporte só pode ser feito antes da 1ª rodada. Aguarde a próxima temporada.</p>';
  return `<p class="muted">Valor do clube (elenco): ${money(clubValue(c))}. Os investidores aportam até ${SAF_MULT}x: <strong>${money(max)}</strong>.</p>
    <form class="row" onsubmit="return false"><label>Valor do aporte (€)<input id="safv" type="number" min="0" max="${max}" step="1000000" value="${Math.round(max / 2e6) * 1e6}"></label>
    <button class="primary" data-act="safInvest">Investir</button></form>`;
}
function freeOffers(p) {
  let cs = careerSuitors(p, 4).filter(c => c.id !== S.man.prev);
  if (cs.length < 2) cs = Object.values(S.clubs).filter(c => c.lg !== 'SA' && c.id !== S.man.prev)
    .sort((a, b) => Math.abs(clubAvg(a) - p.r) - Math.abs(clubAvg(b) - p.r)).slice(0, 4);
  return cs.map(c => careerOffer(p, c));
}
function renderFree() {
  const p = me_p(), offers = UI.freeList ??= freeOffers(p);
  app.innerHTML = `<div class="start"><section class="card"><h1>Você está sem clube</h1>
    <p>${esc(p.n)} · ${POS_NAME[p.p]} · ${p.a} anos · força ${p.r}. Escolha uma das propostas:</p>

      <strong>${esc(c.name)}</strong><span class="muted">${esc(clubWhere(c))}</span>${repBadge(c.rep)}<span>${money(o.sal)}/semana · ${o.yrs} ano(s)</span></button>`; }).join('')}</div>

function renderResults() {
  const R = UI.results, me = S.man.club, um = R.um;
  let groupTitle, list;
  if (R.ev.t === 'L') {
    const club = myClub(), dk = um ? um.div : divKey(club.lg, club.tier);
    list = R.matches.filter(m => m.div === dk);
    groupTitle = divName(S.divs[dk]);
  } else {
    const ids = slotTourIds(R.ev);
    const key = um ? um.key : ids.length ? (ids.find(id => S.tours[id]?.teams.includes(me)) || ids[0]) : R.ev.t === 'E' ? 'EU' : myClub().lg;
    list = R.matches.filter(m => m.key === key);
    groupTitle = S.tours[key] ? S.tours[key].name : getCup(key).name;
  }
  const t = um && S.tours[um.tour], myGroup = t && t.groups.find(g => g.includes(me));
  const groupCard = myGroup && um.stage[0] === 'G' ? `<details class="card" open><summary>Seu grupo</summary>${groupTable(t, myGroup, me)}</details>` : '';
  const scorers = (m, i) => m.ev.filter(e => e.t === 'goal' && e.i === i).map(e => `${esc(P(e.id)?.n ?? '?')} ${e.m}'`).join(', ');
  let umCard = '<p class="notice">Seu time não jogou nesta semana.</p>';
  if (um) {
    const mm = matchMeta(um), mine = um.h === me ? 0 : 1, gf = mine ? um.ga : um.gh, ga = mine ? um.gh : um.ga, w = winner(um);
    const [label, cls] = um.ko && (um.pen || um.agg) && w ? (w === me ? ['Classificado', 'win'] : ['Eliminado', 'loss'])
      : gf > ga ? ['Vitória', 'win'] : gf < ga ? ['Derrota', 'loss'] : ['Empate', 'draw'];
    umCard = `<section class="card match-card"><div class="next-top">${compChip(mm.kind, mm.comp)}<span class="muted">${esc(mm.stage)}</span><span class="badge ${cls}">${label}</span></div>
      ${scoreBox(um)}
      ${um.agg ? `<p class="center">Agregado: ${totals(um)[0]} x ${totals(um)[1]}</p>` : ''}${um.pen ? `<p class="center">Pênaltis: ${um.pen[0]} x ${um.pen[1]}</p>` : ''}
      <p class="muted center">⚽ ${scorers(um, 0) || '—'} | ${scorers(um, 1) || '—'} · 👥 ${um.att.toLocaleString('pt-BR')}</p>
      ${um.motm ? `<p class="center">⭐ Melhor em campo: <strong>${esc(P(um.motm)?.n ?? '?')}</strong> (${fmtRt(um.rt[um.motm])})</p>` : ''}${myPerf(um)}
      ${um.rt ? `<details><summary>Notas do seu time</summary><div class="rts">${[...um.s[um.h === me ? 0 : 1].played].filter(P).sort((a, b) => um.rt[b] - um.rt[a]).map(id =>
        `<span class="rt-chip"><b class="${rtClass(um.rt[id])}">${fmtRt(um.rt[id])}</b> ${esc(P(id).n)}</span>`).join('')}</div></details>` : ''}</section>`;
  }
  let posLine = R.recap ? `<p class="recap">📣 ${esc(R.recap)}</p>` : '';
  if (!posLine && R.ev.t === 'L' && list.length) { const d = S.divs[list[0].div], p = standings(d).indexOf(me) + 1; if (p) posLine = `<p class="center">📊 ${esc(divName(d))}: seu time está em <strong>${p}º</strong></p>`; }
  const ms = list.map(m => `<tr class="${m.h === me || m.a === me ? 'me' : ''}"><td>${crest(m.h, 'sm')} ${esc(C(m.h).name)}</td><td class="n f">${m.gh} x ${m.ga}${m.pen ? ` <span class="muted">(${m.pen[0]}-${m.pen[1]})</span>` : ''}</td><td>${crest(m.a, 'sm')} ${esc(C(m.a).name)}</td></tr>`).join('');
  app.innerHTML = header().replace('data-act="advance"', 'data-act="resultsDone"') + `<div class="start" style="max-width:900px">${umCard}${posLine}
    <p class="center"><button class="primary big" data-act="resultsDone">Continuar ▶</button></p>${groupCard}
    ${R.ev.t === 'L' && list.some(m => m.rt) ? `<details class="card"><summary>🌟 Seleção da rodada</summary>${xiView(roundXI(list), '')}</details>` : ''}
    <details class="card"><summary>Outros jogos — ${esc(groupTitle)} (${list.length})</summary><div class="tw"><table><tbody>${ms || '<tr><td class="muted">Sem jogos.</td></tr>'}</tbody></table></div></details>
    ${R.ev.t === 'L' && list.length ? `<details class="card"><summary>Classificação completa</summary>${miniTable(S.divs[list[0].div], me)}</details>` : ''}</div>`;
}

function evText(m, e) {
  const p = e.id ? P(e.id) : null, n = esc(p ? p.n : '?'), cn = esc(C(m.s[e.i].cid).name);
  switch (e.t) {
    case 'goal': return `⚽ GOL do ${cn}! ${n} marca.`;
    case 'miss': return `${n} (${cn}) finaliza, mas não marca.`;
    case 'yc': return `🟨 Amarelo para ${n} (${cn}).`;
    case 'rc': return `🟥 ${n} (${cn}) expulso — ${esc(e.x)}.`;
    case 'inj': return `🚑 ${n} (${cn}) se lesionou: fora por ${e.x} jogo(s).`;
    case 'sub': return `🔁 ${cn}: entra ${n}${e.x ? `, sai ${esc(P(e.x)?.n ?? '?')}` : ''}.`;
    case 'pen': return `Pênaltis: ${m.pen[0]} x ${m.pen[1]} — ${cn} avança!`;
    case 'var': return `📺 Gol de ${n} (${cn}) anulado pelo VAR.`;
  }
  return '';
}

    <div class="row"><button class="primary" data-act="talk" data-c="calm">😌 Acalmar</button><button class="primary" data-act="talk" data-c="push">😤 Cobrar</button><button class="primary" data-act="talk" data-c="motive">🔥 Motivar</button></div></div>`);

function liveTick() {
  const L = UI.live;
  if (!L || L.paused || UI.screen !== 'match') return;
  const m = L.um;
  do {
    for (const g of L.group) step(g);
    if (m.done) break;
    if (maybeVar(L)) break;
    if (m.min === 45 && !L.ht) { L.ht = true; L.paused = true; L.note = 'Intervalo: dê a palestra, faça alterações e clique em Continuar.'; break; }
    if (maybeMoment(L)) break;
    if (m.needSub) { m.needSub = false; L.paused = true; L.note = 'Um jogador se lesionou! Faça a substituição.'; break; }
  } while (L.speed === 0);
  updateLive();
  if (m.done || L.paused) { renderLiveControls(); return; }
  L.timer = setTimeout(liveTick, L.speed);
}

  retireAsk() {
    openDlg(`<h2 id="dlg-title">Encerrar a carreira?</h2><p>Não dá para voltar atrás.</p>
      <p class="row"><button class="danger" data-act="retireOk">Pendurar as chuteiras</button></p>`);
  },
  retireOk() {
    const p = me_p();
    if (p.club) { S.man.stats.ap += p.ap; S.man.stats.g += p.g; S.man.seasons.unshift({year: S.year, club: C(p.club).name, ap: p.ap, g: p.g, r: p.r}); }
    retire(); closeDlg(); save(); render();
  },
  tab(d) { UI.tab = d.tab; render(); },
  advance() { if (S.slot >= S.cal.length) { endSeason(); render(); return; } advance(); },
  autoAndGo() { closeDlg(); autoPick(myClub()); advance(); },
  goSquad() { closeDlg(); UI.tab = 'squad'; render(); },
  resultsDone() {
    UI.results = null; UI.screen = 'game';
    if (S.man.club && S.slot >= S.cal.length) endSeason();
    render();
  },
  summaryDone() { UI.summary = null; render(); },
  takeJob(d) { takeJob(+d.id); UI.jobList = null; S.man.fireWhy = ''; UI.screen = 'game'; UI.tab = 'club'; save(); render(); },
  toggle(d) {
    const c = myClub(), id = +d.id;
    if (c.xi.includes(id)) { c.xi = c.xi.filter(x => x !== id); if (c.bench.length < 7) c.bench.push(id); }
    else if (c.bench.includes(id)) c.bench = c.bench.filter(x => x !== id);
    else if (c.xi.length < 11) c.xi.push(id);
    else if (c.bench.length < 7) c.bench.push(id);
    else notify('Titulares e reservas estão completos. Remova alguém primeiro.');
    render();
  },
  autoPick() { autoPick(myClub()); render(); },
  sponsor(d) {
    const o = S.sponsorOffers[+d.i];
    if (!o || S.sponsor) return;
    S.sponsor = o; news(`${myClub().name} assina patrocínio master com ${o.n}.`); save(); render();
  },
  closeDlg,
  clubDlg(d) {
    const c = C(+d.id);
    const rows = c.pl.map(P).sort((a, b) => POS.indexOf(a.p) - POS.indexOf(b.p) || b.r - a.r)
      .map(p => `<tr><td>${posTag(p.p)}</td><td>${playerLink(p)}</td><td class="n">${p.a}</td><td class="n f">${p.r}</td><td class="n">${money(p.v)}</td></tr>`).join('');
    openDlg(`<h2 id="dlg-title">${esc(c.name)}</h2><p class="muted">${esc(clubWhere(c))} · ${esc(c.stadium)} (${c.seats.toLocaleString('pt-BR')}) · ${repBadge(c.rep)} · Caixa ${money(c.cash)}${rivalOf(c.id) ? ` · Rival: ${esc(C(rivalOf(c.id)).name)}` : ''}</p>
      <div class="tw" style="max-height:55vh"><table><thead><tr><th>Pos</th><th>Nome</th><th class="n">Id</th><th class="n">Força</th><th class="n">Valor</th></tr></thead><tbody>${rows}</tbody></table></div>${hofList(c)}`);
  },
  playerDlg(d) { playerDlg(+d.id); },
  sell(d) {
    const p = P(+d.id), v = +document.getElementById('sellPrice').value;
    if (!(v > 0)) return playerDlg(p.id, 'Informe um preço válido.', false);
    p.sell = Math.round(v); playerDlg(p.id, `${p.n} foi colocado à venda. Aguarde propostas (com a janela aberta).`, true); save();
  },
  unsell(d) { P(+d.id).sell = 0; playerDlg(+d.id, 'Retirado da lista de venda.', true); },
  renew(d) {
    const p = P(+d.id), yrs = +document.getElementById('renewYears').value, dem = salaryDemand(p, myClub());
    p.sal = dem; p.ct = clamp(yrs, 1, 5);
    playerDlg(p.id, `Contrato renovado por ${p.ct} ano(s) com salário de ${money(dem)}/sem.`, true); save();
  },
  release(d) {
    const p = P(+d.id), cost = Math.round(p.sal * p.ct * 12);
    openDlg(`<h2 id="dlg-title">Dispensar ${esc(p.n)}?</h2><p>A multa rescisória é de <strong>${money(cost)}</strong>.</p>
      <p class="row"><button class="danger" data-act="releaseOk" data-id="${p.id}">Dispensar</button></p>`);
  },
  releaseOk(d) {
    const p = P(+d.id), c = myClub(), cost = Math.round(p.sal * p.ct * 12);
    c.cash -= cost; S.fin.tout += cost; detach(p); p.ct = 0;
    news(`${c.name} dispensou ${p.n}.`); closeDlg(); save(); render();
  },
  buy(d) {
    const p = P(+d.id);
    const fee = +document.getElementById('offerFee')?.value || 0, sal = +document.getElementById('offerSal').value, yrs = clamp(+document.getElementById('offerYears').value, 1, 5);
    if (fee < 0 || !(sal > 0)) return playerDlg(p.id, 'Valores inválidos.', false);
    const err = tryBuy(p, Math.round(fee), Math.round(sal), yrs);
    if (err) return playerDlg(p.id, err, false);
    save(); render(); playerDlg(p.id, `Negócio fechado! ${p.n} agora é seu jogador.`, true);
  },
  offerAccept(d) {
    const m = S.inbox.find(x => x.id === +d.id), p = P(m.pid), b = C(m.from), me = myClub();
    if (!p || p.club !== me.id) m.done = 'jogador não está mais no clube';
    else if (!isWindow(S.slot)) m.done = 'a janela fechou';
    else if (!b || b.cash < m.amount) m.done = 'o comprador desistiu';
    else {
      b.cash -= m.amount; me.cash += m.amount; S.fin.tin += m.amount;
      recordTransfer(p, me.id, b.id, m.amount);
      movePlayer(p, b.id); p.sal = salaryFor(p.v); p.ct = ri(2, 4);
      news(`${p.n} foi vendido ao ${b.name} por ${money(m.amount)}.`);
      m.done = 'aceita';
    }
    save(); render();
  },
  offerReject(d) { S.inbox.find(x => x.id === +d.id).done = 'recusada'; render(); },
  jobAccept(d) {
    const m = S.inbox.find(x => x.id === +d.id);
    if (!C(m.club)) { m.done = 'clube não existe mais'; return render(); }
    m.done = 'aceita'; takeJob(m.club); UI.tab = 'club'; save(); render();
  },
  mktSearch() {
    const f = new FormData(document.querySelector('[data-form="mkt"]'));
    UI.mkt = {q: String(f.get('q') || ''), pos: String(f.get('pos') || ''), lg: String(f.get('lg') || ''),
      min: Math.max(0, +f.get('min') || 0), max: Math.max(0, +f.get('max') || 0), age: Math.max(0, +f.get('age') || 0)};
    render();
  },
  setPrice() { const v = +document.getElementById('price').value; if (v >= 1 && v <= 300) { myClub().price = Math.round(v); save(); render(); } else document.getElementById('price').reportValidity(); },
  expand() {
    const n = +document.getElementById('expand').value, c = myClub(), cost = n * 600;
    if (c.cash < cost) return notify('Dinheiro insuficiente para a obra.');
    c.cash -= cost; c.seats = Math.min(100000, c.seats + n); S.fin.obra += cost; news(`Obras concluídas: ${c.stadium} ganhou ${n} lugares.`); save(); render();
  },
  borrow() {
    const c = myClub(), v = Math.round(+document.getElementById('loan').value), max = Math.max(0, 1e6 + c.rep * 2e5 - c.debt);
    if (!(v > 0) || v > max) return notify(`Valor inválido. Limite disponível: ${money(max)}.`);
    c.cash += v; c.debt += v; save(); render();
  },
  repay() {
    const c = myClub(), v = Math.min(c.debt, Math.round(+document.getElementById('loan').value), Math.max(0, c.cash));
    if (!(v > 0)) return notify('Sem caixa para pagar.');
    c.cash -= v; c.debt -= v; save(); render();
  },
  save() { save(); toast('💾 Jogo salvo no navegador.'); },
  async export() {
    const filename = `wifoot-${S.man.name}-${S.year}.json`, json = JSON.stringify(S);
    // Online (página do Claude) o download passa pelo recurso "downloads", que pede confirmação ao jogador
    const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl) {
      try { await dl.save({filename, data: json}); notify('Arquivo de jogo salvo.'); }
      catch (e) { if (e?.code !== 'declined') notify(e?.code === 'rate_limited' ? 'Já existe um pedido de download aberto. Aguarde e tente de novo.' : 'Não foi possível exportar o jogo nesta página.'); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], {type: 'application/json'})); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  quit() {
    openDlg(`<h2 id="dlg-title">Voltar à tela inicial?</h2><p>O progresso salvo continua disponível.</p>
      <p class="row"><button class="primary" data-act="quitOk">Voltar à tela inicial</button></p>`);
  },
  quitOk() { closeDlg(); save(); UI.screen = 'start'; render(); },
  livePause() { const L = UI.live; L.paused = !L.paused; L.note = ''; renderLiveControls(); updateLive(); if (!L.paused) liveTick(); },
  liveSub() {
    const L = UI.live, m = L.um, s = m.s[m.user];
    const out = +document.getElementById('subOut').value || null, inn = +document.getElementById('subIn').value;
    if (!inn || s.subs <= 0) return;
    if (!out && s.on.length >= 11) return notify('Escolha quem sai.');
    doSub(m, m.user, out, inn);
    renderLiveControls(); updateLive();
  },
  liveFinish() {
    const L = UI.live;
    clearTimeout(L.timer);
    for (const m of L.all) simulate(m);
    const c = myClub(), s = L.um.s[L.um.user];
    c.tac = {...s.tac};
    UI.live = null;
    finishSlot(L.all, L.um);
  },
};
const CHG = {
  form(v) { myClub().tac.f = v; render(); },
  style(v) { myClub().tac.s = +v; render(); },
  tableLg(v) { UI.tableLg = v; UI.tableCup = ''; render(); },
  tableTier(v) { UI.tableLg = UI.tableLg || myClub().lg; UI.tableTier = +v; UI.tableCup = ''; render(); },
  tableCup(v) { UI.tableCup = v; render(); },
  scoreLg(v) { UI.scoreLg = v; render(); },
  scoreTier(v) { UI.scoreLg = UI.scoreLg || myClub().lg; UI.scoreTier = +v; render(); },
  rankConf(v) { UI.rankConf = v; render(); },
  awLg(v) { UI.awLg = v; render(); },
  scoutLg(v) { UI.scoutLg = v; render(); },
  theme(v) { setTheme(v); render(); },
  font(v) { setPref(FONT_KEY, v); applyFont(); },
  matchMode(v) { setPref(MATCH_KEY, v); toast(v === 'quick' ? '⚡ Partidas rápidas: só os lances decisivos.' : 'Partidas ao vivo, completas.'); },
  instr(v) { myClub().tac.i = v; render(); },
  liveInstr(v) { const m = UI.live.um, s = m.s[m.user]; s.tac.i = v; s.dirty = true; },
  buyLg(v) { UI.buyLg = v; render(); },
  liveSpeed(v) { UI.live.speed = +v; },
  liveForm(v) { const m = UI.live.um, s = m.s[m.user]; s.tac.f = v; s.dirty = true; },
  liveStyle(v) { const m = UI.live.um, s = m.s[m.user]; s.tac.s = +v; s.dirty = true; },
};

// Guarda o que já foi preenchido na tela de novo jogo antes de redesenhá-la
function keepPickForm() {
  UI.mname = document.getElementById('mname')?.value ?? UI.mname;
  UI.ppos = document.getElementById('ppos')?.value ?? UI.ppos;
  UI.saf = document.getElementById('saf')?.checked ?? UI.saf;
}

function playerDlg(id, msg, ok) {
  const p = P(id);
  if (!p) return closeDlg();
  const me = myClub(), mine = p.club === me.id, club = p.club ? C(p.club) : null;
  let actions = '';
  if (isCareer()) { /* no Modo Carreira o usuário não negocia jogadores */ }
  else if (mine) {
    const dem = salaryDemand(p, me);
    actions = `<h3>Negociar</h3>
      <form class="row" onsubmit="return false"><label>Preço de venda (€)<input id="sellPrice" type="number" min="1" step="50000" value="${p.sell || p.v}"></label>
      <button data-act="sell" data-id="${id}">${p.sell ? 'Atualizar preço' : 'Colocar à venda'}</button>${p.sell ? `<button data-act="unsell" data-id="${id}">Retirar da venda</button>` : ''}</form>
      <form class="row" onsubmit="return false" style="margin-top:.5rem"><label>Renovar por<select id="renewYears">${[1, 2, 3, 4, 5].map(y => `<option value="${y}">${y} ano(s)</option>`).join('')}</select></label>
      <button data-act="renew" data-id="${id}">Renovar (pede ${money(dem)}/sem)</button></form>
      <p style="margin-top:.5rem"><button class="danger" data-act="release" data-id="${id}">Dispensar jogador</button></p>`;
  } else {
    const dem = salaryDemand(p, me);
    actions = `<h3>Fazer proposta</h3><form class="row" onsubmit="return false">
      ${club ? `<label>Valor da transferência (€)<input id="offerFee" type="number" min="0" step="50000" value="${p.v}"></label>` : '<p class="good">Jogador livre: não há taxa de transferência.</p>'}
      <label>Salário semanal (€)<input id="offerSal" type="number" min="0" step="500" value="${dem}"></label>
      <label>Contrato<select id="offerYears">${[1, 2, 3, 4, 5].map(y => `<option value="${y}" ${y === 3 ? 'selected' : ''}>${y} ano(s)</option>`).join('')}</select></label>
      <button class="primary" data-act="buy" data-id="${id}">Enviar proposta</button></form>`;
  }
  openDlg(`<h2 id="dlg-title">${posTag(p.p)} ${esc(p.n)}</h2>
    ${msg ? `<p class="result ${ok ? 'ok' : 'no'}" role="status">${esc(msg)}</p>` : ''}
    <dl class="kv"><dt>Clube</dt><dd>${club ? esc(club.name) : 'Sem clube (livre)'}${club && tenure(p) >= 5 ? ` · 🏛️ ídolo (${tenure(p)} temporadas)` : ''}</dd><dt>Posição</dt><dd>${POS_NAME[p.p]}</dd>
    <dt>Idade</dt><dd>${p.a} anos</dd><dt>Nacionalidade</dt><dd>${esc(p.nat) || '—'}</dd>
    <dt>Força</dt><dd class="f">${p.r}</dd><dt>Potencial</dt><dd>${potText(p)}</dd>
    ${p.tr ? `<dt>Característica</dt><dd>${TRAITS[p.tr][0]} ${TRAITS[p.tr][1]} <span class="muted">— ${TRAITS[p.tr][2]}</span></dd>` : ''}<dt>Energia</dt><dd>${enBar(p.en)} ${Math.round(p.en)}%</dd>
    <dt>Valor de mercado</dt><dd>${money(p.v)}</dd><dt>Salário</dt><dd>${money(p.sal)}/semana</dd><dt>Contrato</dt><dd>${p.club ? p.ct + ' ano(s)' : '—'}</dd>
    <dt>Temporada</dt><dd>${p.ap} jogos, ${p.g} gols${p.rn ? `, nota média <strong class="${rtClass(avgRt(p))}">${fmtRt(avgRt(p))}</strong>` : ''}</dd><dt>Situação</dt><dd>${statusOf(p) || 'Disponível'}</dd></dl>${actions}`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  ACT[b.dataset.act]?.(b.dataset, b);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pickCountry') { keepPickForm(); UI.pickCountry = t.value; UI.pickClub = null; return render(); }
  if (t.id === 'import' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { loadState(JSON.parse(r.result)); save(); render(); } catch (err) { notify('Não foi possível importar: ' + err.message); } };
    r.readAsText(t.files[0]);
    return;
  }
  if (t.dataset.chg) CHG[t.dataset.chg]?.(t.value);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('[data-form="mkt"]')) { e.preventDefault(); ACT.mktSearch(); } });

// Carrega o jogo salvo antes da primeira tela
// Quais espaços têm jogo salvo (o conteúdo só é lido ao clicar em Continuar)
applyTheme(); applyFont();
Promise.all(SLOTS.map(n => idb('readonly', st => st.count(slotKey(n))).then(c => [n, c > 0]).catch(() => [n, false])))
  .then(r => { UI.has = Object.fromEntries(r); }).finally(render);
</script>
</body>
</html>
