    const c = myClub(), asg = assign(c.xi, c.tac.f);
    const ord = p => POS.indexOf(p.p) * 1000 - p.r;
    const rows = c.pl.map(P).sort((a, b) => ord(a) - ord(b)).map(p => {
      const st = c.xi.includes(p.id) ? 'T' : c.bench.includes(p.id) ? 'R' : '';
      return `<tr><td><button class="sel ${st}" data-act="toggle" data-id="${p.id}" aria-label="Situação de ${esc(p.n)}: ${st === 'T' ? 'titular' : st === 'R' ? 'reserva' : 'fora'}">${st || '–'}</button></td>
        <td>${posTag(p.p)}</td><td>${playerLink(p)}</td><td class="n">${p.a}</td><td class="n f">${p.r}</td><td>${enBar(p.en)}</td><td>${statusOf(p)}</td>
        <td class="n">${p.ap}</td><td class="n">${p.g}</td><td class="n">${money(p.sal)}</td><td class="n">${p.ct}a</td><td class="n">${money(p.v)}</td></tr>`;
    }).join('');
    const field = asg.map(({pos, pid}) => {
      if (!pid) return `<li>${posTag(pos)} <span class="bad">vago</span></li>`;
      const p = P(pid), f = PF[p.p][pos];
      return `<li>${posTag(pos)} ${esc(p.n)} <span class="muted">(${p.r})</span>${f < 1 ? ` <span class="warn" title="Fora de posição">⚠ joga como ${POS_NAME[pos].toLowerCase()} (${Math.round(f * 100)}%)</span>` : ''}${available(p) ? '' : ' <span class="bad">indisponível</span>'}</li>`;
    }).join('');
    return `<section class="card"><div class="row">
      <label>Formação<select data-chg="form">${Object.keys(FORMS).map(f => `<option ${f === c.tac.f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
      <label>Estilo<select data-chg="style">${STYLES.map((s, i) => `<option value="${i}" ${i === c.tac.s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <button data-act="autoPick">Escalar automaticamente</button>
      <span class="muted">Titulares ${c.xi.length}/11 · Reservas ${c.bench.length}/7 · Elenco ${c.pl.length}/35 · Moral: ${moraleText(c.mor)}</span></div>
      <p class="muted">Clique no botão da primeira coluna para alternar: <strong>T</strong> titular → <strong>R</strong> reserva → fora.</p></section>
      <div class="grid2" style="grid-template-columns:minmax(220px,300px) 1fr"><section class="card"><h3>Em campo (${esc(c.tac.f)})</h3><ul style="padding-left:1rem;margin:0">${field}</ul></section>
      <section class="card tw"><table><thead><tr><th></th><th>Pos</th><th>Nome</th><th class="n">Id</th><th class="n">Força</th><th>Energia</th><th>Status</th><th class="n">J</th><th class="n">Gols</th><th class="n">Salário/sem</th><th class="n">Contr.</th><th class="n">Valor</th></tr></thead><tbody>${rows}</tbody></table></section></div>`;
  },

  tables() {
    const c = myClub();
    const lg = UI.tableLg || c.lg, tier = UI.tableLg ? UI.tableTier : c.tier;
    const cupId = UI.tableCup;
    let body;
    if (S.tours[cupId]) body = tourView(S.tours[cupId], c.id);
    else if (cupId) {
      const cup = getCup(cupId);
      body = `<h2>${esc(cup.name)}</h2>${cup.champ ? `<p class="good">🏆 Campeão: ${esc(C(cup.champ).name)}</p>` : `<p class="muted">${cup.alive.length} clubes vivos.</p>`}
        ${koLog(cup.log, c.id)}`;
    } else {
      const d = S.divs[divKey(lg, tier)];
      body = `<h2>${esc(divName(d))}</h2>${miniTable(d, c.id)}
        <p class="muted">${tier === 1 ? `Verde: ${CONMEBOL.has(lg) ? 'Libertadores' : 'Copa dos Campeões'} · Vermelho: rebaixamento (${promoCount(lg)})` : `Azul: acesso (${promoCount(lg)})`}</p>`;
    }
    return `<section class="card"><div class="row">
      <label>Liga<select data-chg="tableLg">${Object.values(LEAGUES).map(l => `<option value="${l.id}" ${l.id === lg && !cupId ? 'selected' : ''}>${esc(l.country)} — ${esc(l.name)}</option>`).join('')}</select></label>
      <label>Divisão<select data-chg="tableTier"><option value="1" ${tier === 1 ? 'selected' : ''}>1ª divisão</option><option value="2" ${tier === 2 ? 'selected' : ''}>Acesso</option></select></label>
      <label>Copas<select data-chg="tableCup"><option value="">—</option>
        ${Object.values(S.tours).map(t => `<option value="${t.id}" ${cupId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
        <option value="EU" ${cupId === 'EU' ? 'selected' : ''}>Copa dos Campeões</option>
        ${Object.keys(LEAGUES).map(id => `<option value="${id}" ${cupId === id ? 'selected' : ''}>${esc(S.cups.nat[id].name)}</option>`).join('')}</select></label></div></section>
      <section class="card">${body}</section>`;
  },

  fixtures() {
    const c = myClub(), d = S.divs[divKey(c.lg, c.tier)];
    const rows = [];
    for (let s = 0; s < S.cal.length; s++) {
      const ev = S.cal[s];
      if (ev.t !== 'L') continue;
      const j = d.roundAt[ev.i];
      if (j == null) continue;
      const g = d.fx[j].find(x => x.includes(c.id));
      if (!g) { rows.push(`<tr><td>${s + 1}</td><td>Rodada ${j + 1}</td><td colspan="3" class="muted">Folga</td></tr>`); continue; }
      const res = (d.res[j] || []).find(r => r[0] === g[0] && r[1] === g[1]);
      let cls = '';
      if (res) { const my = g[0] === c.id ? res[2] - res[3] : res[3] - res[2]; cls = my > 0 ? 'good' : my < 0 ? 'bad' : 'warn'; }
      rows.push(`<tr class="${s === S.slot ? 'me' : ''}"><td>${s + 1}</td><td>Rodada ${j + 1}</td><td>${g[0] === c.id ? 'Casa' : 'Fora'}</td><td>${clubLink(g[0] === c.id ? g[1] : g[0])}</td>
        <td class="f ${cls}">${res ? `${res[2]} x ${res[3]}` : '—'}</td></tr>`);
    }
    const cupRows = [S.cups.nat[c.lg], S.cups.euro].flatMap(cup => cup.log.flatMap(r => r.games.filter(g => g[0] === c.id || g[1] === c.id)
      .map(([h, a, gh, ga, pen]) => `<tr><td>${esc(cup.name)}</td><td>${esc(r.name)}</td><td>${esc(C(h).name)} ${gh} x ${ga} ${esc(C(a).name)}${pen ? ` (pên. ${pen[0]}-${pen[1]})` : ''}</td></tr>`)));
    for (const t of Object.values(S.tours)) {
      for (const [h, a, gh, ga] of t.glog) if (h === c.id || a === c.id) cupRows.push(`<tr><td>${esc(t.name)}</td><td>Fase de grupos</td><td>${esc(C(h).name)} ${gh} x ${ga} ${esc(C(a).name)}</td></tr>`);
      for (const r of t.log) for (const [h, a, gh, ga, pen, agg] of r.games) if (h === c.id || a === c.id)
        cupRows.push(`<tr><td>${esc(t.name)}</td><td>${esc(r.name)}</td><td>${esc(C(h).name)} ${gh} x ${ga} ${esc(C(a).name)}${agg ? ` (agregado ${agg[0]}-${agg[1]})` : ''}${pen ? ` (pên. ${pen[0]}-${pen[1]})` : ''}</td></tr>`);
    }
    return `<section class="card"><h2>Liga — ${esc(divName(d))}</h2><div class="tw"><table><thead><tr><th>Sem.</th><th>Rodada</th><th>Mando</th><th>Adversário</th><th>Resultado</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>
      <section class="card"><h2>Copas</h2>${cupRows.length ? `<div class="tw"><table><tbody>${cupRows.join('')}</tbody></table></div>` : '<p class="muted">Nenhum jogo de copa ainda.</p>'}</section>`;
  },

  scorers() {
    const c = myClub(), lg = UI.scoreLg || c.lg, tier = UI.scoreLg ? UI.scoreTier : c.tier;
    const ids = new Set(S.divs[divKey(lg, tier)].clubs);
    const top = Object.values(S.players).filter(p => p.g > 0 && ids.has(p.club)).sort((a, b) => b.g - a.g || a.ap - b.ap).slice(0, 25);
    return `<section class="card"><div class="row">
      <label>Liga<select data-chg="scoreLg">${Object.values(LEAGUES).map(l => `<option value="${l.id}" ${l.id === lg ? 'selected' : ''}>${esc(l.country)} — ${esc(l.name)}</option>`).join('')}</select></label>
      <label>Divisão<select data-chg="scoreTier"><option value="1" ${tier === 1 ? 'selected' : ''}>1ª divisão</option><option value="2" ${tier === 2 ? 'selected' : ''}>Acesso</option></select></label></div>
      <p class="muted">Gols em todas as competições da temporada.</p>
      <div class="tw"><table><thead><tr><th class="n">#</th><th>Jogador</th><th>Pos</th><th>Clube</th><th class="n">Jogos</th><th class="n">Gols</th></tr></thead><tbody>
      ${top.map((p, i) => `<tr class="${p.club === c.id ? 'me' : ''}"><td class="n">${i + 1}</td><td>${playerLink(p)}</td><td>${posTag(p.p)}</td><td>${esc(C(p.club).name)}</td><td class="n">${p.ap}</td><td class="n f">${p.g}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nenhum gol ainda.</td></tr>'}
      </tbody></table></div></section>`;
  },

  market() {
    const f = UI.mkt, me = S.man.club, q = f.q.trim().toLowerCase();
    // dev-senior: busca linear em ~11 mil jogadores; rápido o suficiente no navegador
    const out = [];
    for (const p of Object.values(S.players)) {
      if (p.club === me) continue;
      if (f.pos && p.p !== f.pos) continue;
      if (f.lg === 'FREE') { if (p.club) continue; } else if (f.lg && (!p.club || C(p.club).lg !== f.lg)) continue;
      if (p.r < f.min || (f.max && p.v > f.max) || (f.age && p.a > f.age)) continue;
      if (q && !p.n.toLowerCase().includes(q)) continue;
      out.push(p);
    }
    out.sort((a, b) => b.r - a.r);
    return `<section class="card"><h2>Transferências</h2>
      <p class="${isWindow(S.slot) ? 'good' : 'warn'}">${isWindow(S.slot) ? 'Janela aberta: compre e venda à vontade.' : `Janela fechada (abre nas ${windowText()}). Jogadores livres podem ser contratados a qualquer momento.`}</p>
      <form class="row" data-form="mkt" onsubmit="return false">
        <label>Nome<input name="q" value="${esc(f.q)}" placeholder="Buscar..."></label>
        <label>Posição<select name="pos"><option value="">Todas</option>${POS.map(p => `<option value="${p}" ${f.pos === p ? 'selected' : ''}>${POS_NAME[p]}</option>`).join('')}</select></label>
        <label>Liga<select name="lg"><option value="">Todas</option><option value="FREE" ${f.lg === 'FREE' ? 'selected' : ''}>Jogadores livres</option><option value="SA" ${f.lg === 'SA' ? 'selected' : ''}>Outros sul-americanos</option>${Object.values(LEAGUES).map(l => `<option value="${l.id}" ${f.lg === l.id ? 'selected' : ''}>${esc(l.country)}</option>`).join('')}</select></label>
        <label>Força mínima<input name="min" type="number" min="0" max="99" value="${f.min || ''}"></label>
        <label>Valor máximo (€)<input name="max" type="number" min="0" step="100000" value="${f.max || ''}"></label>
        <label>Idade máxima<input name="age" type="number" min="15" max="45" value="${f.age || ''}"></label>
        <button class="primary" data-act="mktSearch">Buscar</button></form></section>
      <section class="card tw"><p class="muted">${out.length} jogadores encontrados${out.length > 100 ? ' (mostrando os 100 mais fortes)' : ''}.</p>
      <table><thead><tr><th>Pos</th><th>Nome</th><th class="n">Id</th><th class="n">Força</th><th>Clube</th><th>Nac.</th><th class="n">Valor</th><th class="n">Salário/sem</th></tr></thead><tbody>
      ${out.slice(0, 100).map(p => `<tr><td>${posTag(p.p)}</td><td>${playerLink(p)}</td><td class="n">${p.a}</td><td class="n f">${p.r}</td><td>${p.club ? esc(C(p.club).name) : '<span class="good">Livre</span>'}</td><td>${esc(p.nat)}</td><td class="n">${money(p.v)}</td><td class="n">${money(p.sal)}</td></tr>`).join('')}
      </tbody></table></section>`;
  },

  finance() {
    const c = myClub(), F = S.fin, wages = weeklyWages(c);
    const inc = F.ing + F.pat + F.prem + F.tin, out = F.sal + F.tout + F.obra + F.jur;
    const loanMax = Math.max(0, 1e6 + c.rep * 2e5 - c.debt);
    return `<div class="grid2"><section class="card"><h2>Balanço da temporada</h2>
      <div class="tw"><table><tbody>
      <tr><td>Bilheteria</td><td class="n good">${money(F.ing)}</td></tr><tr><td>Patrocínio e TV</td><td class="n good">${money(F.pat)}</td></tr>
      <tr><td>Premiações</td><td class="n good">${money(F.prem)}</td></tr><tr><td>Venda de jogadores</td><td class="n good">${money(F.tin)}</td></tr>
      <tr><td>Salários</td><td class="n bad">-${money(F.sal)}</td></tr><tr><td>Compra de jogadores</td><td class="n bad">-${money(F.tout)}</td></tr>
      <tr><td>Obras no estádio</td><td class="n bad">-${money(F.obra)}</td></tr><tr><td>Juros</td><td class="n bad">-${money(F.jur)}</td></tr>
      <tr><th>Resultado</th><th class="n ${inc - out >= 0 ? 'good' : 'bad'}">${money(inc - out)}</th></tr></tbody></table></div>
      <dl class="kv" style="margin-top:.6rem"><dt>Caixa</dt><dd class="f">${money(c.cash)}</dd><dt>Dívida no banco</dt><dd>${money(c.debt)}</dd>
      <dt>Folha semanal</dt><dd>${money(wages)}</dd></dl>
      <h2 style="margin-top:1rem">Patrocínio master</h2>
      ${S.sponsor ? `<p><strong>${esc(S.sponsor.n)}</strong>: ${money(S.sponsor.week)}/semana${S.sponsor.win ? ` + ${money(S.sponsor.win)} por vitória` : ''}${S.sponsor.goal ? ` + ${money(S.sponsor.goal)} se cumprir o objetivo` : ''}. Contrato até o fim da temporada.</p>`
      : `<p class="muted">Escolha uma proposta para esta temporada (se não escolher, a diretoria assina a primeira ao jogar a próxima rodada):</p>
        ${S.sponsorOffers.map((o, i) => `<div class="msg"><strong>${esc(o.n)}</strong> — ${money(o.week)}/semana${o.win ? ` + ${money(o.win)} por vitória` : ''}${o.goal ? ` + ${money(o.goal)} pelo objetivo` : ''}
          <br><span class="muted">${esc(o.desc)}</span> <button data-act="sponsor" data-i="${i}">Assinar</button></div>`).join('')}`}</section>
      <section class="card"><h2>Ingressos</h2>
        <p class="muted">Preço de referência para o seu clube: ${money(c.ref)}. Mais caro dá mais receita por torcedor, mas esvazia o estádio.</p>
        <form class="row" onsubmit="return false"><label>Preço do ingresso (€)<input id="price" type="number" min="1" max="300" value="${c.price}" required></label>
        <button data-act="setPrice">Salvar</button></form>
        <h2 style="margin-top:1rem">Estádio</h2><p>${esc(c.stadium)}: <strong>${c.seats.toLocaleString('pt-BR')}</strong> lugares.</p>
        <form class="row" onsubmit="return false"><label>Ampliar (lugares)<select id="expand">${[1000, 2000, 5000, 10000].map(n => `<option value="${n}">+${n.toLocaleString('pt-BR')} — ${money(n * 600)}</option>`).join('')}</select></label>
        <button data-act="expand" ${c.seats >= 100000 ? 'disabled' : ''}>Construir</button></form>
        <h2 style="margin-top:1rem">Banco</h2><p class="muted">Juros de 0,8% por semana sobre a dívida. Limite disponível: ${money(loanMax)}.</p>
        <form class="row" onsubmit="return false"><label>Valor (€)<input id="loan" type="number" min="0" step="100000" value="1000000"></label>
        <button data-act="borrow">Pegar empréstimo</button><button data-act="repay" ${c.debt ? '' : 'disabled'}>Pagar dívida</button></form></section></div>`;
  },

  inbox() {
    S.inbox.forEach(m => { m.readLater = !m.read; m.read = true; });
    return `<section class="card"><h2>Mensagens</h2>${S.inbox.length ? S.inbox.map(m => {
      let actions = '';
      if (m.type === 'offer' && !m.done) actions = `<div class="row" style="margin-top:.3rem"><button class="primary" data-act="offerAccept" data-id="${m.id}">Aceitar</button><button data-act="offerReject" data-id="${m.id}">Recusar</button></div>`;
      if (m.type === 'job' && !m.done) actions = `<div class="row" style="margin-top:.3rem"><button class="primary" data-act="jobAccept" data-id="${m.id}">Aceitar o cargo</button><button data-act="offerReject" data-id="${m.id}">Recusar</button></div>`;
      return `<div class="msg ${m.readLater ? 'unread' : ''}"><span class="muted">Semana ${m.slot + 1}</span> — ${esc(m.text)}${m.done ? ` <em class="muted">(${esc(m.done)})</em>` : ''}${actions}</div>`;
    }).join('') : '<p class="muted">Caixa de entrada vazia.</p>'}</section>`;
  },

  ranking() {
    const me = S.man.club, conf = UI.rankConf || '';
    const all = rankList().filter(([id]) => !conf || (conf === 'SA') === isSA(C(id)));
    const myPos = all.findIndex(x => x[0] === me);
    const row = ([id, pts], i) => { const c = C(id);
      return `<tr class="${id === me ? 'me' : ''}"><td class="n">${i + 1}</td><td>${clubLink(id)}</td><td>${esc(clubCountry(c))}</td><td>${isSA(c) ? 'CONMEBOL' : 'UEFA'}</td><td class="n f">${pts.toFixed(1)}</td><td class="n">${(S.rank.cur[id] || 0).toFixed(1)}</td></tr>`; };
    return `<section class="card"><h2>Ranking Mundial de Clubes</h2>
      <p class="muted">Soma dos pontos das últimas 4 temporadas (a atual + 3 anteriores). Pontuam: vitórias e empates em jogos internacionais e cada fase alcançada
      (Super Mundial vale mais, depois Mundial de Clubes, Copa dos Campeões e Libertadores, e por fim a Sul-Americana), além de títulos nacionais.
      O ranking define os potes dos sorteios e as vagas do Super Mundial.</p>
      <div class="row"><label>Confederação<select data-chg="rankConf"><option value="">Todas</option>
        <option value="EU" ${conf === 'EU' ? 'selected' : ''}>UEFA (Europa)</option><option value="SA" ${conf === 'SA' ? 'selected' : ''}>CONMEBOL (América do Sul)</option></select></label>
        <span>Seu clube: <strong>${myPos >= 0 ? `${myPos + 1}º` : 'sem pontos'}</strong></span></div></section>
      <section class="card tw"><table><thead><tr><th class="n">#</th><th>Clube</th><th>País</th><th>Conf.</th><th class="n">Pontos</th><th class="n">Nesta temporada</th></tr></thead><tbody>
      ${all.slice(0, 50).map(row).join('')}${myPos >= 50 ? `<tr><td colspan="6" class="muted">…</td></tr>${row(all[myPos], myPos)}` : ''}
      </tbody></table></section>`;
  },

  history() {
    const rows = S.history.map(h => COMP_NAME[h.lg]
      ? `<tr><td>${h.year}</td><td>${COMP_NAME[h.lg]}</td><td class="f">${esc(h.c1)}</td><td>${h.c2 ? `vice: ${esc(h.c2)}` : ''}</td><td></td></tr>`
      : `<tr><td>${h.year}</td><td>${esc(LEAGUES[h.lg].country)}</td><td class="f">${esc(h.c1)}</td><td>${esc(h.c2)}</td><td>${esc(h.cup)}</td></tr>`).join('');
    return `<div class="grid2"><section class="card"><h2>Sua carreira</h2>
      <dl class="kv"><dt>Treinador</dt><dd>${esc(S.man.name)}</dd><dt>Reputação</dt><dd>${S.man.rep}/100</dd></dl>
      <h3 style="margin-top:.8rem">Títulos</h3>${S.man.titles.length ? `<ul>${S.man.titles.map(t => `<li>🏆 ${esc(t)}</li>`).join('')}</ul>` : '<p class="muted">Nenhum ainda.</p>'}
      <h3>Trajetória</h3><ul>${S.man.history.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>
      <section class="card tw"><h2>Campeões</h2>${rows ? `<table><thead><tr><th>Ano</th><th>País</th><th>1ª divisão</th><th>Acesso</th><th>Copa</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="muted">Termine uma temporada para ver os campeões.</p>'}</section></div>`;
  },

  game() {
    return `<section class="card"><h2>Jogo</h2><p class="muted">O jogo é salvo automaticamente no navegador depois de cada rodada.</p>
      <div class="row"><button data-act="save">Salvar agora</button><button data-act="export">Exportar arquivo de jogo</button>
      <label>Importar arquivo de jogo<input type="file" id="import" accept="application/json,.json"></label>
      <button class="danger" data-act="quit">Voltar à tela inicial</button></div></section>
      <section class="card"><h2>Como jogar</h2><ul>
      <li><strong>Elenco:</strong> escolha 11 titulares e até 7 reservas. Jogador fora de posição rende menos.</li>
      <li><strong>Energia:</strong> cai durante os jogos e recupera durante a semana. Faça rodízio.</li>
      <li><strong>Cartões:</strong> 3 amarelos ou 1 vermelho causam suspensão. Lesões afastam por algumas semanas.</li>
      <li><strong>Transferências:</strong> compre e venda com a janela aberta. Anuncie jogadores para receber propostas.</li>
      <li><strong>Finanças:</strong> salários saem toda semana; bilheteria, patrocínio e prêmios entram. Caixa negativo irrita a diretoria.</li>
      <li><strong>Temporada:</strong> liga em turno e returno e copa nacional. Os últimos colocados caem e os primeiros da divisão de acesso sobem.</li>
      <li><strong>Europa:</strong> Copa dos Campeões em mata-mata com os 2 primeiros de cada país.</li>
      <li><strong>América do Sul:</strong> Libertadores (Brasil: 6 primeiros + campeão da Copa do Brasil; Argentina: 5 + campeão da Copa Argentina) e Sul-Americana (os 6 seguintes de cada país), com clubes de mais 8 países. Grupos de 4, mata-mata em ida e volta e final única.</li>
      <li><strong>Mundial de Clubes:</strong> todo fim de ano, campeão da Libertadores x campeão europeu. <strong>Super Mundial:</strong> a cada 4 anos (2029, 2033…), 32 clubes em 8 grupos e mata-mata.</li>
      <li><strong>Ranking Mundial:</strong> títulos e campanhas internacionais rendem pontos; quanto mais importante a competição, mais pontos.</li>

function evText(m, e) {
  const p = e.id ? P(e.id) : null, n = esc(p ? p.n : '?'), cn = esc(C(m.s[e.i].cid).name);
  switch (e.t) {
    case 'goal': return `⚽ GOL do ${cn}! ${n} marca.`;
    case 'miss': return `${n} (${cn}) finaliza, mas não marca.`;
    case 'yc': return `🟨 Amarelo para ${n} (${cn}).`;
    case 'rc': return `🟥 ${n} (${cn}) expulso — ${esc(e.x)}.`;
    case 'inj': return `🚑 ${n} (${cn}) se lesionou: fora por ${e.x} jogo(s).`;
    case 'sub': return `🔁 ${cn}: entra ${n}${e.x ? `, sai ${esc(P(e.x)?.n ?? '?')}` : ''}.`;
    case 'pen': return `Pênaltis: ${m.pen[0]} x ${m.pen[1]} — ${cn} avança!`;
  }
  return '';
}
function renderMatch() {
  const L = UI.live, m = L.um;

    <div class="grid2"><section class="card"><h2>Lances</h2><ul class="evlist" id="live-ev" aria-live="polite"></ul></section>
    <section class="card"><h2>${esc(m.comp === 'L' ? divName(S.divs[m.div]) : m.tour ? S.tours[m.tour].name + ' — ' + stageLabel(m.stage) : getCup(m.cup).name + ' — ' + getCup(m.cup).rname)}</h2><div id="live-others" class="tw"></div></section></div>

function updateLive() {
  const L = UI.live, m = L.um;
  const sc = document.getElementById('live-score');
  if (!sc) return;
  sc.innerHTML = `<div class="score"><div class="t">${esc(C(m.h).name)}</div><div class="g">${m.gh}</div><div>x</div><div class="g">${m.ga}</div><div class="t">${esc(C(m.a).name)}</div></div>

function renderLiveControls() {
  const L = UI.live, m = L.um, s = m.s[m.user];
  const box = document.getElementById('live-ctrl');
  if (!box) return;
  if (m.done) {
    box.innerHTML = `<p style="text-align:center"><button class="primary" data-act="liveFinish">Ver resultados da rodada ▶</button></p>`;
    return;
  }
  const opt = id => { const p = P(id); return `<option value="${id}">${p.p} · ${esc(p.n)} (${p.r}, ${Math.round(p.en)}%)</option>`; };
  box.innerHTML = `<div class="row">

    <label>Formação<select data-chg="liveForm">${Object.keys(FORMS).map(f => `<option ${f === s.tac.f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
    <label>Estilo<select data-chg="liveStyle">${STYLES.map((n, i) => `<option value="${i}" ${i === s.tac.s ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
    <div class="row" style="margin-top:.6rem">
    <label>Sai<select id="subOut">${s.on.map(opt).join('')}<option value="">(vaga aberta)</option></select></label>
    <label>Entra<select id="subIn">${s.bench.map(opt).join('')}</select></label>
    <button data-act="liveSub" ${s.subs > 0 && s.bench.length ? '' : 'disabled'}>Substituir (${s.subs} restantes)</button></div>`;
}
function liveTick() {
  const L = UI.live;
  if (!L || L.paused || UI.screen !== 'match') return;
  const m = L.um;
  do {
    for (const g of L.group) step(g);
    if (m.done) break;
    if (m.min === 45 && !L.ht) { L.ht = true; L.paused = true; L.note = 'Intervalo: faça alterações e clique em Continuar.'; break; }
    if (m.needSub) { m.needSub = false; L.paused = true; L.note = 'Um jogador se lesionou! Faça a substituição.'; break; }
  } while (L.speed === 0);
  updateLive();
  if (m.done || L.paused) { renderLiveControls(); return; }
  L.timer = setTimeout(liveTick, L.speed);
}

  },

    c.cash -= cost; S.fin.tout += cost; detach(p); p.ct = 0;

  },

    const p = P(+d.id);
    const fee = +document.getElementById('offerFee')?.value || 0, sal = +document.getElementById('offerSal').value, yrs = clamp(+document.getElementById('offerYears').value, 1, 5);
    if (fee < 0 || !(sal > 0)) return playerDlg(p.id, 'Valores inválidos.', false);
    const err = tryBuy(p, Math.round(fee), Math.round(sal), yrs);
    if (err) return playerDlg(p.id, err, false);
    save(); render(); playerDlg(p.id, `Negócio fechado! ${p.n} agora é seu jogador.`, true);
  },
  offerAccept(d) {
    const m = S.inbox.find(x => x.id === +d.id), p = P(m.pid), b = C(m.from), me = myClub();
    if (!p || p.club !== me.id) m.done = 'jogador não está mais no clube';
    else if (!isWindow(S.slot)) m.done = 'a janela fechou';
    else if (!b || b.cash < m.amount) m.done = 'o comprador desistiu';
    else {
      b.cash -= m.amount; me.cash += m.amount; S.fin.tin += m.amount;
      movePlayer(p, b.id); p.sal = salaryFor(p.v); p.ct = ri(2, 4);

  export() {

    <dt>Força</dt><dd class="f">${p.r}${p.a <= 23 && p.pt > p.r + 3 ? ' <span class="good">(promessa)</span>' : ''}</dd><dt>Energia</dt><dd>${enBar(p.en)} ${Math.round(p.en)}%</dd>
    <dt>Valor de mercado</dt><dd>${money(p.v)}</dd><dt>Salário</dt><dd>${money(p.sal)}/semana</dd><dt>Contrato</dt><dd>${p.club ? p.ct + ' ano(s)' : '—'}</dd>
    <dt>Temporada</dt><dd>${p.ap} jogos, ${p.g} gols</dd><dt>Situação</dt><dd>${statusOf(p) || 'Disponível'}</dd></dl>${actions}`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  ACT[b.dataset.act]?.(b.dataset, b);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pickCountry') { UI.mname = document.getElementById('mname').value; UI.pickCountry = t.value; UI.pickClub = null; return render(); }
  if (t.id === 'import' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { loadState(JSON.parse(r.result)); save(); render(); } catch (err) { alert('Não foi possível importar: ' + err.message); } };
    r.readAsText(t.files[0]);
    return;
  }
  if (t.dataset.chg) CHG[t.dataset.chg]?.(t.value);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('[data-form="mkt"]')) { e.preventDefault(); ACT.mktSearch(); } });

render();
</script>
</body>
</html>
