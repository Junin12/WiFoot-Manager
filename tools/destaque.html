<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem de destaque da Play Store</title>
<!-- Renderizada em 1024x500 por tools/capturas.ps1 (loja/destaque-1024x500.png) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{position:relative;color:#fff;font-family:Inter,system-ui,sans-serif;
  background:radial-gradient(90% 80% at 30% -10%,#13603d 0,transparent 60%),linear-gradient(#04170f,#021009)}
.beam{position:absolute;top:-60%;width:420px;height:900px;background:linear-gradient(rgba(220,255,200,.25),transparent 70%);filter:blur(16px)}
.beam.l{left:-120px;transform:rotate(-26deg)}.beam.r{right:-120px;transform:rotate(26deg)}
.pitch{position:absolute;left:-20%;right:-20%;bottom:-18%;height:62%;
  background:radial-gradient(circle at 50% 24%,transparent 0 12%,rgba(255,255,255,.25) 12.4% 13%,transparent 13.3%),
    linear-gradient(90deg,transparent calc(50% - 2px),rgba(255,255,255,.25) calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px)),
    repeating-linear-gradient(90deg,#0c5a34 0 8%,#0a4d2d 8% 16%);
  transform:perspective(500px) rotateX(58deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000 40%)}
.in{position:relative;display:flex;align-items:center;gap:44px;height:100%;padding:0 70px}
img{width:220px;height:220px;filter:drop-shadow(0 16px 30px rgba(0,0,0,.5)) drop-shadow(0 0 36px rgba(31,224,138,.4))}
h1{margin:0;font:800 92px/.9 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;text-shadow:0 6px 24px rgba(0,0,0,.45)}
h1 span{display:block;font-size:46px;letter-spacing:.32em;color:#c8ff3d;text-shadow:0 0 20px rgba(200,255,61,.45)}
p{margin:14px 0 18px;font-size:24px;color:#d6f0de}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tags b{font:600 16px Inter,sans-serif;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
</style>
</head>
<body>
<span class="beam l"></span><span class="beam r"></span><div class="pitch"></div>
<div class="in"><img src="icone.svg" alt="">
  <div><h1>WiFoot <span>Manager</span></h1><p>Monte seu time. Escreva sua história.</p>
  <div class="tags"><b>📋 Treinador</b><b>👟 Modo Carreira</b><b>🏆 35 ligas</b><b>⚡ Partida rápida</b></div></div></div>
</body>
</html>
